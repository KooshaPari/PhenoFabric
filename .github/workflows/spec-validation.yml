name: Spec Validation

on:
  push:
    branches: [main]
    paths:
      - "specs/**/*.md"
      - "specs/**/*.json"
      - "adr/**/*.md"
      - "architecture/**/*.md"
      - "architecture/**/*.yaml"
      - "cmd/capprobe/**/*.go"
      - "cmd/capprobe/go.mod"
      - "cmd/checker/**/*.go"
      - "cmd/checker/go.mod"
      - "cmd/wire/**/*.go"
      - "cmd/wire/go.mod"
      - "cmd/wire/testdata/**/*.json"
      - "program/scripts/**"
      - ".github/workflows/spec-validation.yml"
      - ".github/workflows/**"
      - "MANIFEST.sha256"
  pull_request:
    paths:
      - "specs/**/*.md"
      - "specs/**/*.json"
      - "adr/**/*.md"
      - "architecture/**/*.md"
      - "architecture/**/*.yaml"
      - "cmd/capprobe/**/*.go"
      - "cmd/capprobe/go.mod"
      - "cmd/checker/**/*.go"
      - "cmd/checker/go.mod"
      - "cmd/wire/**/*.go"
      - "cmd/wire/go.mod"
      - "cmd/wire/testdata/**/*.json"
      - "program/scripts/**"
      - ".github/workflows/spec-validation.yml"
      - ".github/workflows/**"
      - "MANIFEST.sha256"

jobs:
  validate:
    name: Validate specs and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The validation scripts need PyYAML. It was previously absent from the
      # CI image, so check_openapi.py hit its ImportError guard and printed
      # "WARNING: PyYAML not installed; skipping OpenAPI check" -- the OpenAPI
      # validation had been silently inert. Installing it makes that check
      # real, and gives check_workflows.py the parser it needs.
      - name: Install Python dependencies
        run: python3 -m pip install --disable-pip-version-check -r program/scripts/requirements.txt

      - name: Validate spec JSON schemas
        run: python3 program/scripts/check_json_schemas.py

      - name: Validate OpenAPI spec
        run: python3 program/scripts/check_openapi.py

      - name: Validate spec links
        run: python3 program/scripts/check_links.py

      # Two silent release failures on 2026-10-21 shared a root cause: a
      # workflow step wrote one output name while its consumers read another
      # (so `TAG` expanded to the empty string), and a multi-line `pattern:`
      # block scalar was passed to `download-artifact`, whose `pattern` input
      # is a SINGLE glob (so it matched nothing and v0.1.3 published with
      # zero assets while the job exited 0). Both are statically checkable.
      - name: Validate GitHub Actions workflows
        run: python3 program/scripts/check_workflows.py

      # The static lint above cannot tell whether a checksum gate
      # actually fails closed. This test extracts the real `run:` blocks
      # out of release.yml and executes them against deliberately broken
      # fixtures. It exists because three holes were found exactly this
      # way: an orphan sidecar, a malformed manifest line, and duplicate
      # manifest lines all passed the release gates with exit 0.
      - name: Test release checksum gates fail closed
        run: python3 program/scripts/test_release_checksums.py

      # The multi-arch Docker publish can succeed while leaving an
      # architecture out of the published manifest list. This test
      # stubs `docker buildx imagetools inspect` and proves the check
      # FAILS when an architecture is missing -- a check that only ever
      # passes is indistinguishable from no check.
      - name: Test Docker manifest architecture check fails closed
        run: bash scripts/acceptance/test_docker_manifest_archs.sh

      # The release version was derived from `${GITHUB_REF#refs/tags/}`,
      # which is correct ONLY for a tag push. On a workflow_dispatch run
      # it yields the literal string "refs/heads/main", which becomes the
      # artifact filename prefix, the Docker tag, and the name of the
      # release `gh release download` looks for. The v0.1.7 release could
      # not be re-run from a fixed commit because the dispatch path could
      # not even name the version it was republishing.
      #
      # This test stubs `git ls-remote` and proves the resolver FAILS when
      # it cannot determine a version, when the named tag does not exist,
      # and when the version is malformed -- and that it never guesses.
      - name: Test release version resolution fails closed
        run: bash scripts/acceptance/test_resolve_version.sh

      # The release version must be resolved in exactly ONE place and
      # never from the git ref. On a workflow_dispatch run the ref is a
      # BRANCH, so `${GITHUB_REF#refs/tags/}` yields "refs/heads/main"
      # and `github.ref_name` yields "main". Both became release names:
      # run 40180377333 built and published every artifact correctly and
      # was then refused by the required-asset gate, which looked for
      # "phenotype-fabric-main-linux-x86_64.tar.gz" while the build had
      # produced "phenotype-fabric-v0.1.7-linux-x86_64.tar.gz".
      #
      # This test proves the workflow has no ref-derived version left and
      # that every job reading a version output resolves it itself.
      - name: Test release version comes from one source, not the git ref
        run: python3 program/scripts/test_release_version_source.py

      # The release workflow declares its platforms twice: once in the
      # build matrix, and once in the fail-closed required-asset gate
      # that refuses to publish a release missing one. Nothing links the
      # two lists, so they can drift: a platform that is built but not
      # required can ship broken and the gate will not notice, and a
      # platform that is required but not built fails the release at TAG
      # time rather than at PR time.
      #
      # This test compares the two lists directly and also asserts the
      # mandatory platform set, so a platform cannot be quietly dropped
      # from the matrix.
      - name: Test release platform lists agree
        run: python3 program/scripts/test_release_platforms.py

      - name: Validate MANIFEST matches file tree
        run: python3 program/scripts/check_manifest.py

  check-go:
    name: Go test (capprobe + checker + wire)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # cmd/capprobe/go.mod declares `go 1.22` (the highest of the three
          # cmd/<name>/go.mod files). Pin to 1.22 here so the module can be
          # loaded without needing GOTOOLCHAIN=auto to fetch a newer toolchain
          # at run time.
          go-version: "1.22"
          cache: false

      - name: Go vet (capprobe)
        working-directory: cmd/capprobe
        run: go vet ./...

      - name: Go test (capprobe)
        working-directory: cmd/capprobe
        run: go test -count=1 ./...

      - name: Go vet (checker)
        working-directory: cmd/checker
        run: go vet ./...

      - name: Go test (checker)
        working-directory: cmd/checker
        run: go test -count=1 ./...

      - name: Go vet (wire)
        working-directory: cmd/wire
        run: go vet ./...

      - name: Go test (wire)
        working-directory: cmd/wire
        run: go test -count=1 ./...

      - name: Run fabric checker against acceptance fixture
        working-directory: cmd/checker
        run: |
          go build -o /tmp/fabric-checker .
          # Admit fixture.
          #
          # This previously read:
          #   go run . testdata/admit/descriptor.json testdata/admit/manifest.yaml
          # which was wrong twice over: the checker takes FLAGS, not positional
          # paths (it printed its usage and exited 2), and testdata/admit/ does
          # not exist in this repository at all. So this step could never pass,
          # and `|| true` was concealing that rather than reporting it.
          #
          # It now uses a real fixture pair and the checker's actual interface.
          # gpu_descriptor_minimal + gpu_manifest_minimal is a genuine admit
          # case: it returns {"decision":"Admit","findings":null}.
          go run . -descriptor testdata/gpu_descriptor_minimal.json -manifest testdata/gpu_manifest_minimal.json

  rust-check:
    name: Rust test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Linux GUI dependencies
        # fabric-persist and the GUI/surface crates pull in glib-sys, atk-sys,
        # cairo-sys and similar -sys crates whose build scripts need the
        # matching system headers and pkg-config files. Without these, the
        # `cargo test --workspace` build fails inside
        # target/debug/build/<crate>-<hash>/build-script-build with
        # "Package glib-2.0 was not found in the pkg-config search path."
        # This list mirrors the install step in .github/workflows/ci.yml
        # (clippy job) exactly so both workflows stay consistent.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libglib2.0-dev \
            libatk1.0-dev \
            libatk-bridge2.0-dev \
            libdbus-1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libgdk-pixbuf-2.0-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev

      - name: Cargo test (workspace)
        run: cargo test --workspace --no-fail-fast
