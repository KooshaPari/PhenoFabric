name: Spec Validation

on:
  push:
    branches: [main]
    paths:
      - "specs/**/*.md"
      - "specs/**/*.json"
      - "adr/**/*.md"
      - "architecture/**/*.md"
      - "architecture/**/*.yaml"
      - "cmd/capprobe/**/*.go"
      - "cmd/capprobe/go.mod"
      - "cmd/checker/**/*.go"
      - "cmd/checker/go.mod"
      - "cmd/wire/**/*.go"
      - "cmd/wire/go.mod"
      - "cmd/wire/testdata/**/*.json"
      - "program/scripts/**"
      - ".github/workflows/spec-validation.yml"
      - "MANIFEST.sha256"
  pull_request:
    paths:
      - "specs/**/*.md"
      - "specs/**/*.json"
      - "adr/**/*.md"
      - "architecture/**/*.md"
      - "architecture/**/*.yaml"
      - "cmd/capprobe/**/*.go"
      - "cmd/capprobe/go.mod"
      - "cmd/checker/**/*.go"
      - "cmd/checker/go.mod"
      - "cmd/wire/**/*.go"
      - "cmd/wire/go.mod"
      - "cmd/wire/testdata/**/*.json"
      - "program/scripts/**"
      - ".github/workflows/spec-validation.yml"
      - "MANIFEST.sha256"

jobs:
  validate:
    name: Validate specs and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate spec JSON schemas
        run: python3 program/scripts/check_json_schemas.py

      - name: Validate OpenAPI spec
        run: python3 program/scripts/check_openapi.py

      - name: Validate spec links
        run: python3 program/scripts/check_links.py

      - name: Validate MANIFEST matches file tree
        run: python3 program/scripts/check_manifest.py

  check-go:
    name: Go test (capprobe + checker + wire)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # cmd/capprobe/go.mod declares `go 1.22` (the highest of the three
          # cmd/<name>/go.mod files). Pin to 1.22 here so the module can be
          # loaded without needing GOTOOLCHAIN=auto to fetch a newer toolchain
          # at run time.
          go-version: "1.22"
          cache: false

      - name: Go vet (capprobe)
        working-directory: cmd/capprobe
        run: go vet ./...

      - name: Go test (capprobe)
        working-directory: cmd/capprobe
        run: go test -count=1 ./...

      - name: Go vet (checker)
        working-directory: cmd/checker
        run: go vet ./...

      - name: Go test (checker)
        working-directory: cmd/checker
        run: go test -count=1 ./...

      - name: Go vet (wire)
        working-directory: cmd/wire
        run: go vet ./...

      - name: Go test (wire)
        working-directory: cmd/wire
        run: go test -count=1 ./...

      - name: Run fabric checker against acceptance fixture
        working-directory: cmd/checker
        run: |
          go build -o /tmp/fabric-checker .
          # Admit fixture.
          #
          # This previously read:
          #   go run . testdata/admit/descriptor.json testdata/admit/manifest.yaml
          # which was wrong twice over: the checker takes FLAGS, not positional
          # paths (it printed its usage and exited 2), and testdata/admit/ does
          # not exist in this repository at all. So this step could never pass,
          # and `|| true` was concealing that rather than reporting it.
          #
          # It now uses a real fixture pair and the checker's actual interface.
          # gpu_descriptor_minimal + gpu_manifest_minimal is a genuine admit
          # case: it returns {"decision":"Admit","findings":null}.
          go run . -descriptor testdata/gpu_descriptor_minimal.json -manifest testdata/gpu_manifest_minimal.json

  rust-check:
    name: Rust test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Linux GUI dependencies
        # fabric-persist and the GUI/surface crates pull in glib-sys, atk-sys,
        # cairo-sys and similar -sys crates whose build scripts need the
        # matching system headers and pkg-config files. Without these, the
        # `cargo test --workspace` build fails inside
        # target/debug/build/<crate>-<hash>/build-script-build with
        # "Package glib-2.0 was not found in the pkg-config search path."
        # This list mirrors the install step in .github/workflows/ci.yml
        # (clippy job) exactly so both workflows stay consistent.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libglib2.0-dev \
            libatk1.0-dev \
            libatk-bridge2.0-dev \
            libdbus-1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libgdk-pixbuf-2.0-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev

      - name: Cargo test (workspace)
        run: cargo test --workspace --no-fail-fast
