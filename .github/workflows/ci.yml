name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Formatting ──────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  # ── Lint (clippy) ──────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-clippy-

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libglib2.0-dev \
            libatk1.0-dev \
            libatk-bridge2.0-dev \
            libdbus-1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libgdk-pixbuf-2.0-dev \
            libpango1.0-dev \
            libcairo2-dev

      - name: Run clippy (all targets)
        # Raw job logs are not readable by every collaborator on this repo, but
        # the check-runs annotations API is. Emit the first failures as
        # annotations so a red job is diagnosable without log access.
        run: |
          set +e
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::clippy failed with exit $status on $(rustc --version) / $(cargo clippy --version)"
            # CARGO_TERM_COLOR=always wraps messages in ANSI codes, which stops
            # ^error from matching. Strip them before extracting.
            sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' /tmp/clippy.log > /tmp/clippy.clean

            grep -E '^(error|warning: unused)' /tmp/clippy.clean | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            grep -E '^ *--> ' /tmp/clippy.clean | head -20 | while IFS= read -r line; do
              echo "::error::at$line"
            done
            echo "::error::--- last 40 lines of clippy.log ---"
            tail -40 /tmp/clippy.clean | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$status"
          fi

      # Feature-flag coverage formerly provided by the removed tf-ci.yml
      # (terminal-fabric crates absorbed into the workspace in e65cdfc).
      - name: Run clippy (self-update feature)
        run: |
          set +e
          cargo clippy -p fabric-terminal -p fabric-capture --all-targets --features self-update -- -D warnings 2>&1 | tee /tmp/clippy-selfupdate.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::clippy (self-update) failed with exit $status on $(rustc --version)"
            # CARGO_TERM_COLOR=always wraps messages in ANSI codes, which stops
            # ^error from matching. Strip them before extracting.
            sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' /tmp/clippy-selfupdate.log > /tmp/clippy-selfupdate.clean

            grep -E '^(error|warning: unused)' /tmp/clippy-selfupdate.clean | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            grep -E '^ *--> ' /tmp/clippy-selfupdate.clean | head -20 | while IFS= read -r line; do
              echo "::error::at$line"
            done
            echo "::error::--- last 40 lines of clippy-selfupdate.log ---"
            tail -40 /tmp/clippy-selfupdate.clean | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$status"
          fi

  # ── Check ───────────────────────────────────────────────────────────
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-check-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-check-

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libglib2.0-dev \
            libatk1.0-dev \
            libatk-bridge2.0-dev \
            libdbus-1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libgdk-pixbuf-2.0-dev \
            libpango1.0-dev \
            libcairo2-dev

      - name: Cargo check (workspace)
        run: cargo check --workspace --all-targets

  # ── Unit tests ──────────────────────────────────────────────────────
  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libglib2.0-dev \
            libatk1.0-dev \
            libatk-bridge2.0-dev \
            libdbus-1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libgdk-pixbuf-2.0-dev \
            libpango1.0-dev \
            libcairo2-dev

      - name: Run unit tests (--lib)
        run: |
          set +e
          cargo test --workspace --lib --no-fail-fast 2>&1 | tee /tmp/unit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::unit tests failed with exit $status on $(rustc --version)"
            # CARGO_TERM_COLOR=always wraps messages in ANSI codes, which stops
            # ^error from matching. Strip them before extracting.
            sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' /tmp/unit.log > /tmp/unit.clean

            grep -E '^error(\[|:)' /tmp/unit.clean | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            grep -E '^(test result: FAILED|failures:)' /tmp/unit.clean | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            grep -A 6 'panicked at' /tmp/unit.clean | head -60 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "::error::--- last 40 lines of unit.log ---"
            tail -40 /tmp/unit.clean | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$status"
          fi

  # ── Integration tests ──────────────────────────────────────────────
  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libglib2.0-dev \
            libatk1.0-dev \
            libatk-bridge2.0-dev \
            libdbus-1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libgdk-pixbuf-2.0-dev \
            libpango1.0-dev \
            libcairo2-dev

      - name: Run integration tests (--test)
        run: |
          set +e
          cargo test --workspace --test '*' --no-fail-fast 2>&1 | tee /tmp/integ.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::integration tests failed with exit $status on $(rustc --version)"
            # CARGO_TERM_COLOR=always wraps messages in ANSI codes, which stops
            # ^error from matching. Strip them before extracting.
            sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' /tmp/integ.log > /tmp/integ.clean

            grep -E '^error(\[|:)' /tmp/integ.clean | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            grep -E '^(test result: FAILED|failures:)' /tmp/integ.clean | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            grep -A 6 'panicked at' /tmp/integ.clean | head -60 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "::error::--- last 40 lines of integ.log ---"
            tail -40 /tmp/integ.clean | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$status"
          fi

  # ── E2E smoke tests ─────────────────────────────────────────────────
  test-e2e:
    name: E2E smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-unit
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-e2e-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-e2e-

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libglib2.0-dev \
            libatk1.0-dev \
            libatk-bridge2.0-dev \
            libdbus-1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libgdk-pixbuf-2.0-dev \
            libpango1.0-dev \
            libcairo2-dev

      - name: Run E2E smoke tests
        run: cargo test -p fabric-integration-tests --test e2e_smoke --no-fail-fast

  # ── Release build verification ──────────────────────────────────────
  build-release:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libglib2.0-dev \
            libatk1.0-dev \
            libatk-bridge2.0-dev \
            libdbus-1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libgdk-pixbuf-2.0-dev \
            libpango1.0-dev \
            libcairo2-dev

      - name: Build release binaries
        run: cargo build --workspace --release --bins
