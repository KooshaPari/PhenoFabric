name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A release is the only event after which a new archive is publicly live,
  # so it is the only event on which a check against the PUBLISHED release can
  # say something meaningful about the tag just cut. release.yml's `verify`
  # job already hard-fails on the tag push itself; this runs after publication
  # and confirms what users can actually download. See the
  # `release-archive` job comments.
  release:
    types: [published]

# Cancel in-progress runs for the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Formatting ──────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  # ── Lint (clippy) ──────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-clippy-

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libglib2.0-dev \
            libatk1.0-dev \
            libatk-bridge2.0-dev \
            libdbus-1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libgdk-pixbuf-2.0-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev

      - name: Run clippy (all targets)
        # Raw job logs are not readable by every collaborator on this repo, but
        # the check-runs annotations API is. Emit the first failures as
        # annotations so a red job is diagnosable without log access.
        run: |
          set +e
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::clippy failed (exit ${status}) on $(rustc --version)"
            # CARGO_TERM_COLOR=always wraps messages in ANSI codes, which defeats
            # an '^error' anchor. Strip them, then surface only the highest-value
            # lines: link failures first (a missing -l is the classic case), then
            # compile errors, then test failures. Kept well under GitHub's
            # 50-annotation-per-step cap; exceeding it silently drops the tail.
            sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' /tmp/clippy.log > /tmp/clippy.log.clean
            grep -nE 'cannot find -l|undefined reference|/usr/bin/ld:|collect2:|error\[|^error|warning: unused|panicked at|test result: FAILED|^failures:' /tmp/clippy.log.clean \
              | head -22 | while IFS= read -r l; do echo "::error::$l"; done
            exit "$status"
          fi
      # Feature-flag coverage formerly provided by the removed tf-ci.yml
      # (terminal-fabric crates absorbed into the workspace in e65cdfc).
      - name: Run clippy (self-update feature)
        run: |
          set +e
          cargo clippy -p fabric-terminal -p fabric-capture --all-targets --features self-update -- -D warnings 2>&1 | tee /tmp/clippy-su.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::clippy (self-update) failed (exit ${status}) on $(rustc --version)"
            # CARGO_TERM_COLOR=always wraps messages in ANSI codes, which defeats
            # an '^error' anchor. Strip them, then surface only the highest-value
            # lines: link failures first (a missing -l is the classic case), then
            # compile errors, then test failures. Kept well under GitHub's
            # 50-annotation-per-step cap; exceeding it silently drops the tail.
            sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' /tmp/clippy-su.log > /tmp/clippy-su.log.clean
            grep -nE 'cannot find -l|undefined reference|/usr/bin/ld:|collect2:|error\[|^error|warning: unused|panicked at|test result: FAILED|^failures:' /tmp/clippy-su.log.clean \
              | head -22 | while IFS= read -r l; do echo "::error::$l"; done
            exit "$status"
          fi
  # ── Check ───────────────────────────────────────────────────────────
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-check-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-check-

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libglib2.0-dev \
            libatk1.0-dev \
            libatk-bridge2.0-dev \
            libdbus-1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libgdk-pixbuf-2.0-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev

      - name: Cargo check (workspace)
        run: cargo check --workspace --all-targets

  # ── Unit tests ──────────────────────────────────────────────────────
  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libglib2.0-dev \
            libatk1.0-dev \
            libatk-bridge2.0-dev \
            libdbus-1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libgdk-pixbuf-2.0-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev

      - name: Run unit tests (--lib)
        run: |
          set +e
          cargo test --workspace --lib --no-fail-fast 2>&1 | tee /tmp/unit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::unit tests failed (exit ${status}) on $(rustc --version)"
            # CARGO_TERM_COLOR=always wraps messages in ANSI codes, which defeats
            # an '^error' anchor. Strip them, then surface only the highest-value
            # lines: link failures first (a missing -l is the classic case), then
            # compile errors, then test failures. Kept well under GitHub's
            # 50-annotation-per-step cap; exceeding it silently drops the tail.
            sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' /tmp/unit.log > /tmp/unit.log.clean
            grep -nE 'cannot find -l|undefined reference|/usr/bin/ld:|collect2:|error\[|^error|warning: unused|panicked at|test result: FAILED|^failures:' /tmp/unit.log.clean \
              | head -22 | while IFS= read -r l; do echo "::error::$l"; done
            exit "$status"
          fi
  # ── Integration tests ──────────────────────────────────────────────
  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libglib2.0-dev \
            libatk1.0-dev \
            libatk-bridge2.0-dev \
            libdbus-1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libgdk-pixbuf-2.0-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev

      - name: Run integration tests (--test)
        run: |
          set +e
          cargo test --workspace --test '*' --no-fail-fast 2>&1 | tee /tmp/integ.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::integration tests failed (exit ${status}) on $(rustc --version)"
            # CARGO_TERM_COLOR=always wraps messages in ANSI codes, which defeats
            # an '^error' anchor. Strip them, then surface only the highest-value
            # lines: link failures first (a missing -l is the classic case), then
            # compile errors, then test failures. Kept well under GitHub's
            # 50-annotation-per-step cap; exceeding it silently drops the tail.
            sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' /tmp/integ.log > /tmp/integ.log.clean
            grep -nE 'cannot find -l|undefined reference|/usr/bin/ld:|collect2:|error\[|^error|warning: unused|panicked at|test result: FAILED|^failures:' /tmp/integ.log.clean \
              | head -22 | while IFS= read -r l; do echo "::error::$l"; done
            exit "$status"
          fi
  # ── E2E smoke tests ─────────────────────────────────────────────────
  test-e2e:
    name: E2E smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-unit
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-e2e-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-e2e-

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libglib2.0-dev \
            libatk1.0-dev \
            libatk-bridge2.0-dev \
            libdbus-1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libgdk-pixbuf-2.0-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev

      - name: Run E2E smoke tests
        run: cargo test -p fabric-integration-tests --test e2e_smoke --no-fail-fast

  # ── Release build verification ──────────────────────────────────────
  build-release:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libglib2.0-dev \
            libatk1.0-dev \
            libatk-bridge2.0-dev \
            libdbus-1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libgdk-pixbuf-2.0-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev

      - name: Build release binaries
        run: cargo build --workspace --release --bins

  # ── Release archive contents ────────────────────────────────────────
  # The v0.1.2 archive (2026-10-15) shipped only 3 of the 5 binaries
  # install.sh requires, and nobody noticed until install.sh was exercised
  # end-to-end. The guard in release.yml (235dc18 / 9bf620e, both 2026-10-16)
  # landed AFTER that tag and has never run against a published release, so
  # it has never actually bitten. This job makes the guard bite on ordinary
  # pushes, against the archive this commit would produce.
  #
  # Two independent halves:
  #
  #   A. The archive THIS COMMIT produces. Release-shaped and therefore a hard
  #      failure on every run: build the linux-x86_64 release binaries, package
  #      them exactly the way release.yml does, then assert the tarball really
  #      contains all five required binaries. This is the half that prevents a
  #      repeat -- it fails on a rename of any [[bin]] target the release bin
  #      list depends on, long before a tag is cut.
  #
  #   B. The archive ALREADY PUBLISHED, i.e. what a user installing today gets.
  #      This is a property of the past, not of this commit: v0.1.2 is
  #      incomplete and no PR can fix that, only a new release can. So it is a
  #      hard failure on `release: published` (the moment a new archive went
  #      live, where a partial one is a genuine regression) and a loud
  #      ::warning annotation on every ordinary push/PR, where red would only
  #      train everyone to ignore it.
  release-archive:
    name: Release archive contents
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [fmt, clippy]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo registry & target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-release-archive-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-archive-

      - name: Install Linux build dependencies (x86_64)
        uses: ./.github/actions/linux-build-deps
        with:
          arch: host

      # ── A: the archive this commit would ship ─────────────────────────
      - name: Build release binaries (linux-x86_64)
        run: cargo build --workspace --release --bins --target x86_64-unknown-linux-gnu

      - name: Assert expected release binaries exist
        shell: bash
        env:
          # Must stay byte-identical to EXPECTED_RELEASE_BINS in
          # release.yml's `build` job and to install.sh's REQUIRED list.
          EXPECTED_RELEASE_BINS: fabric fabric-daemon fabric-tui fabric-tray fabric-graph-cli
        run: |
          TARGET_DIR="target/x86_64-unknown-linux-gnu/release"
          missing=0
          for bin in $EXPECTED_RELEASE_BINS; do
            path="${TARGET_DIR}/${bin}"
            if [ ! -f "$path" ]; then
              echo "::error::Expected release binary not found: $path"
              echo "::error::Is '$bin' a real cargo [[bin]] target? Check: cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; [print(t[\"name\"]) for p in json.load(sys.stdin)[\"packages\"] for t in p[\"targets\"] if \"bin\" in t[\"kind\"]]'"
              missing=1
              continue
            fi
            if [ ! -x "$path" ]; then
              echo "::error::Release binary is not executable: $path"
              missing=1
              continue
            fi
            echo "OK release binary: $path"
          done
          if [ "$missing" = "1" ]; then
            echo "::error::One or more expected release binaries are missing; this commit would ship a partial archive."
            exit 1
          fi
          echo "All expected release binaries present: $EXPECTED_RELEASE_BINS"

      - name: Package the release archive
        shell: bash
        env:
          EXPECTED_RELEASE_BINS: fabric fabric-daemon fabric-tui fabric-tray fabric-graph-cli
        run: |
          # Mirrors release.yml's `Create archive (Unix)` step. CI has no tag,
          # so a synthetic one stands in: install.sh builds the outer asset
          # name and the inner directory from the same version string, and
          # the assertion below pins that contract, so the stand-in does not
          # weaken the check.
          TAG="v0.0.0-ci"
          PLATFORM="linux-x86_64"
          DIST="phenotype-fabric-${TAG}-${PLATFORM}"
          TARGET_DIR="target/x86_64-unknown-linux-gnu/release"
          mkdir -p "$DIST"
          for bin in $EXPECTED_RELEASE_BINS; do
            cp "$TARGET_DIR/$bin" "$DIST/"
          done
          cp LICENSE* "$DIST/" 2>/dev/null || true
          cp README.md "$DIST/" 2>/dev/null || true
          tar czf "${DIST}.tar.gz" "$DIST"
          echo "archive=${DIST}.tar.gz" >> "$GITHUB_ENV"

      - name: Assert the built archive contains the expected binaries
        shell: bash
        env:
          EXPECTED_RELEASE_BINS: fabric fabric-daemon fabric-tui fabric-tray fabric-graph-cli
        run: |
          # The step above only proves the binaries were copied locally. This
          # step looks INSIDE the tarball, which is the same check release.yml's
          # post-publish `verify` job runs against the published archives --
          # the check that did not exist when v0.1.2 shipped a partial archive.
          TAG="v0.0.0-ci"
          PLATFORM="linux-x86_64"
          INNER="phenotype-fabric-${TAG}-${PLATFORM}"
          ARCHIVE="${INNER}.tar.gz"
          listing=$(tar tzf "$ARCHIVE")
          echo "---- ${ARCHIVE} ----"
          printf '%s\n' "$listing"

          failed=0
          # install.sh refuses to install unless the archive carries its
          # top-level dir under exactly this name (harness assertion T5).
          if ! printf '%s\n' "$listing" | grep -qxF "${INNER}/"; then
            echo "::error::${ARCHIVE} does not contain the top-level dir install.sh expects: ${INNER}/"
            failed=1
          fi
          for bin in $EXPECTED_RELEASE_BINS; do
            if ! printf '%s\n' "$listing" | grep -qxF "${INNER}/${bin}"; then
              echo "::error::${ARCHIVE} does not contain expected binary '${bin}'"
              failed=1
            fi
          done
          if [ "$failed" = "1" ]; then
            echo "::error::This commit would ship a partial archive; refusing to green-light it."
            exit 1
          fi
          echo "OK built archive ${ARCHIVE} contains: ${EXPECTED_RELEASE_BINS}"

      # ── B: the archive already published ───────────────────────────────
      - name: Check the published release for a partial archive
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_RELEASE_BINS: fabric fabric-daemon fabric-tui fabric-tray fabric-graph-cli
          # Hard-fail only when a release just went public. See the job
          # comment: on an ordinary push the published archive cannot be
          # changed by this commit, so a red here would be unfixable noise.
          RELEASE_EVENT: ${{ github.event_name == 'release' }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -uo pipefail
          if [ "$RELEASE_EVENT" = "true" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" \
                    --json tagName --jq .tagName 2>/dev/null || true)"
          fi
          if [ -z "$TAG" ]; then
            echo "::notice::No published release found on $GITHUB_REPOSITORY; nothing to verify."
            exit 0
          fi

          PLATFORM="linux-x86_64"
          ARCHIVE="phenotype-fabric-${TAG}-${PLATFORM}.tar.gz"

          # One verdict for every "the published archive is wrong" case: a hard
          # failure the moment a release went live, an annotation otherwise.
          verdict() {
            echo "::error::$1"
            echo "::error::The fix is to publish a corrected release, not to change code on this branch."
            echo "::error::$ARCHIVE (release ${TAG}) is what the documented install command downloads today."
            exit 1
          }
          advise() {
            echo "::warning::title=Partial published release ${TAG}::$1 Fix: cut a corrected release. Hard failure on release: published; advisory on ordinary pushes and PRs so an unrelated PR is not blocked by a defect only a new release can fix."
          }

          rm -rf assets && mkdir -p assets
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern "$ARCHIVE" --dir assets; then
            msg="Published release ${TAG} has no ${ARCHIVE} asset."
            if [ "$RELEASE_EVENT" = "true" ]; then verdict "$msg"; else advise "$msg"; exit 0; fi
          fi

          listing=$(tar tzf "assets/${ARCHIVE}")
          echo "---- published ${ARCHIVE} ----"
          printf '%s\n' "$listing"

          missing=""
          for bin in $EXPECTED_RELEASE_BINS; do
            # Use a here-string, not `printf ... | grep -q`. `grep -q` exits
            # on the first match and closes the pipe, so `printf` dies of
            # SIGPIPE; with `pipefail` set (this step enables it) the
            # pipeline reports failure and the binary is wrongly recorded
            # as missing. The listing of a real archive is large enough to
            # trigger this.
            grep -qE "/${bin}$" <<<"$listing" || missing="${missing} ${bin}"
          done
          if [ -n "$missing" ]; then
            msg="Published release ${TAG} ships a PARTIAL archive. Missing:${missing}"
            if [ "$RELEASE_EVENT" = "true" ]; then verdict "$msg"; else advise "$msg"; exit 0; fi
          fi
          echo "OK published release ${TAG} contains: ${EXPECTED_RELEASE_BINS}"

      # ── C: exercise install.sh itself against the published release ──
      # The step above inspects the archive. This one runs the actual
      # installer end-to-end, which is the only thing that proves install.sh
      # and the published archive AGREE: it resolves the asset name, extracts
      # it, and installs. program/scripts/test_install.sh redirects every
      # write into a temp dir (INSTALL_DIR override), so /usr/local/bin is
      # never touched.
      #
      # The harness resolves the newest published release at run time, so
      # after a corrected release is cut this automatically tests the NEW
      # archive instead of a stale pin.
      - name: Exercise install.sh against the published release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_EVENT: ${{ github.event_name == 'release' }}
        run: |
          set -uo pipefail
          # T6 of the harness asserts the published archive carries every
          # required binary. On a release event that assertion failing is a
          # fresh regression and must be RED. On an ordinary push the
          # published archive is a property of the past that no PR can fix,
          # so it stays advisory for the same reason as the step above.
          if bash program/scripts/test_install.sh; then
            echo "OK install.sh installs the published release cleanly."
          else
            if [ "$RELEASE_EVENT" = "true" ]; then
              echo "::error::install.sh does not install the freshly published release cleanly."
              exit 1
            fi
            echo "::warning::title=install.sh cannot install the published release::The currently published release is incomplete (see the step above). install.sh correctly REFUSES to install a partial toolchain. Fix: publish a corrected release."
          fi

  # ── Docker image builds ──────────────────────────────────────────────
  # The Dockerfile was never built by CI, so its dependency-stub layer
  # drifted out of sync with the workspace. On the v0.1.4 release the Docker
  # build failed with 7 distinct missing-target errors, e.g.:
  #
  #   error: can't find lib `fabric_cli` at path
  #   `/build/crates/fabric-cli/src/lib.rs`
  #   error: can't find bin `tf-web` at path
  #   `/build/crates/fabric-terminal/src/web_main.rs`
  #
  # because the stub layer was a hand-maintained list of every declared
  # cargo target, and cargo refuses to resolve the workspace at all when
  # any declared target's source file is missing. The stub layer has since
  # been REMOVED from the Dockerfile (it never provided useful caching,
  # because every crate the image needs is a path dependency of another
  # workspace crate, so the cache was warmed with stub crates rather than
  # the real ones).
  #
  # This job is what makes any future Docker breakage visible at PR time
  # instead of at release time. It asserts three things:
  #
  #   1. the image builds at all (cargo resolves the whole workspace);
  #   2. both binaries the runtime stage consumes are present;
  #   3. both binaries actually LOAD and run inside the image -- a binary
  #      that is present but fails to load (for example because a shared
  #      library such as libssl.so.3 is missing from the runtime stage)
  #      is just as broken as a missing binary.
  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the Docker image
        run: docker build --tag fabric-ci:probe --load .

      - name: Verify the image contains the expected binaries
        run: |
          set -uo pipefail
          cid="$(docker create fabric-ci:probe)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          listing="$(docker export "$cid" | tar t)"
          missing=0
          for bin in fabric fabric-daemon; do
            # The runtime stage copies these to /usr/local/bin (see the
            # Dockerfile's runtime stage).
            #
            # Match against the listing with a here-string rather than
            # `printf ... | grep -q`. `grep -q` exits as soon as it finds a
            # match, which closes the pipe early; `printf` then dies of
            # SIGPIPE, and because `pipefail` is set the whole pipeline
            # reports failure. The symptom is a FALSE "missing binary"
            # error on a perfectly good image -- the assertion used to
            # fail on a large image listing while the image was correct.
            if ! grep -qE "^usr/local/bin/${bin}$" <<<"$listing"; then
              echo "::error::Docker image is missing /usr/local/bin/${bin}"
              missing=1
            else
              echo "OK Docker image contains /usr/local/bin/${bin}"
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::The Docker image does not contain the expected binaries."
            exit 1
          fi

      - name: Verify the binaries load and run inside the image
        run: |
          set -uo pipefail
          failed=0
          # Both binaries are clap apps with the built-in `version` flag, so
          # `--version` prints a version string and exits 0. Running them
          # also proves every shared library the binary needs is present in
          # the runtime stage.
          check_binary() {
            bin="$1"; shift
            out="$(docker run --rm --entrypoint "/usr/local/bin/${bin}" fabric-ci:probe "$@" 2>&1)"
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::${bin} $* failed inside the image (exit ${rc})"
              echo "${out}" | sed 's/^/    /'
              failed=1
              return
            fi
            if grep -qiE 'error while loading shared libraries|not found' <<<"$out"; then
              echo "::error::${bin} could not load a required shared library inside the image"
              echo "${out}" | sed 's/^/    /'
              failed=1
              return
            fi
            echo "OK ${bin} $* runs inside the image: ${out}"
          }
          check_binary fabric --version
          check_binary fabric-daemon --version
          if [ "$failed" = "1" ]; then
            echo "::error::One or more Docker image binaries do not run inside the image."
            exit 1
          fi

      # This is the assertion that actually exercises the product. The
      # checks above prove the binaries exist and load; they cannot catch
      # an image whose DEFAULT ENTRYPOINT fails to start, because they
      # override the entrypoint with `--entrypoint`.
      #
      # The v0.1.5 image had exactly that defect and every check above
      # passed: the image built, both binaries ran, but a plain
      # `docker run <image>` died with
      #
      #   ERROR fabric_daemon: failed to create coordinator: database
      #   error: unable to open database file: state.db
      #
      # because the daemon opens a RELATIVE database path and the image
      # had no WORKDIR, so it resolved against `/`, which the
      # unprivileged `fabric` user cannot write.
      #
      # A second, independent defect lived in the same image: the daemon
      # binds 127.0.0.1 by default, so `docker run -p 9400:9400` published
      # a port nothing listened on and a CLI in another container got
      # "Broken pipe".
      #
      # Both are only observable by starting the daemon and talking to
      # it over the wire protocol. That is what this step does.
      - name: Verify the daemon starts and serves the wire protocol
        run: |
          set -uo pipefail
          failed=0

          # ── 1. The default invocation must not crash ────────────────
          # `docker run` with no arguments is the single most likely user
          # command. It must start the daemon and keep running.
          echo "::group::Default invocation starts the daemon"
          # Publish the port so the assertions below can reach the daemon
          # from OUTSIDE the container. A container with no published port
          # is only reachable over loopback, which would make those
          # assertions vacuous.
          cid="$(docker run --rm -d -p 9400:9400 fabric-ci:probe 2>&1)" || {
            echo "::error::docker run failed to create a container"
            echo "${cid}" | sed 's/^/    /'
            exit 1
          }
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          # The daemon must still be running after a grace period. A crash
          # on startup (the state.db defect) shows up here as a container
          # that has already exited.
          sleep 5
          if ! docker ps --filter "id=${cid}" --filter "status=running" \
               --format '{{.ID}}' | grep -q .; then
            echo "::error::The container exited during startup"
            echo "::group::Container logs"
            docker logs "$cid" 2>&1 | sed 's/^/    /' || true
            echo "::endgroup::"
            exit 1
          fi
          echo "OK the container is still running after a default 'docker run'"

          # ── 2. The daemon must serve the wire protocol ──────────────
          # Probe over the PUBLISHED port with the CLI in a SEPARATE
          # container. That is the real user path and it exercises both
          # the bind address and the wire protocol at once.
          #
          # `docker exec` is deliberately avoided here: it spawns a
          # process inside the container, which is slow enough under
          # emulation to make a timeout-based poll flaky. The CLI
          # connecting from outside is both more realistic and more
          # stable.
          echo "::group::The daemon serves the wire protocol"
          port="$(docker port "$cid" 9400 2>/dev/null | head -1 | sed 's/.*://')"
          if [ -z "$port" ]; then
            port=9400
          fi

          # Retry: the daemon needs a moment to open its database and
          # bind the socket after the container starts.
          healthy=0
          for _ in $(seq 1 20); do
            out="$(docker run --rm --network host --entrypoint /usr/local/bin/fabric \
                     fabric-ci:probe status --daemon "127.0.0.1:${port}" 2>&1)"
            rc=$?
            if [ "$rc" -eq 0 ] && grep -qi 'healthy' <<<"$out"; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" != "1" ]; then
            echo "::error::The CLI could not reach a healthy daemon over the published port ${port}"
            echo "${out}" | sed 's/^/    /'
            echo "::group::Container logs"
            docker logs "$cid" 2>&1 | sed 's/^/    /' || true
            echo "::endgroup::"
            echo "::error::The Docker image does not work as a running daemon."
            exit 1
          fi
          echo "OK the CLI reaches a healthy daemon over the published port ${port}"
          echo "${out}" | sed 's/^/    /'
          echo "::endgroup::"

          # ── 3. The image's own HEALTHCHECK must reach 'healthy' ─────
          # The probe in the v0.1.5 image PRINTED the correct healthy
          # JSON and then blocked forever, because it waited for EOF on
          # a connection the daemon intentionally keeps open. The
          # container's health check therefore always timed out, and a
          # working daemon was reported unhealthy -- which makes an
          # orchestrator restart it in a loop.
          #
          # Assertion 2 cannot see that defect: the CLI is a separate
          # binary with its own one-shot client. This assertion runs the
          # IMAGE's health check, so it is the one that catches a probe
          # that hangs.
          echo "::group::The image HEALTHCHECK reaches 'healthy'"
          health_state=""
          for _ in $(seq 1 20); do
            health_state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid" 2>/dev/null || echo none)"
            if [ "$health_state" = "healthy" ]; then
              break
            fi
            # A container that exited cannot become healthy; fail fast
            # rather than burning the whole retry budget.
            if ! docker ps --filter "id=${cid}" --filter "status=running" \
                 --format '{{.ID}}' | grep -q .; then
              break
            fi
            sleep 3
          done

          if [ "$health_state" != "healthy" ]; then
            echo "::error::The image HEALTHCHECK never reached 'healthy' (last state: ${health_state:-unknown})"
            echo "::group::Health check log"
            docker inspect --format '{{range .State.Health.Log}}{{.ExitCode}} {{.Output}}{{end}}' "$cid" 2>&1 | sed 's/^/    /' || true
            echo "::endgroup::"
            echo "::group::Container logs"
            docker logs "$cid" 2>&1 | sed 's/^/    /' || true
            echo "::endgroup::"
            echo "::error::The Docker image's health check does not work."
            exit 1
          fi
          echo "OK the image HEALTHCHECK reports healthy"
