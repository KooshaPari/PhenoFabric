name: Dependency Audit

on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
  schedule:
    # Weekly on Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Pinned deliberately. `--locked` only pins cargo's own
      # dependency resolution, not the cargo-deny release, so an
      # unpinned install floats to newest. When the runner picked up
      # a release whose SPDX parser rejects the license expressions
      # in deny.toml, the job died on
      # "error[custom]: expected a `WITH` here" and reported
      # `failed to deserialize config from deny.toml`. That made the
      # dependency-audit gate's pass/fail depend on the runner's
      # cached tool version rather than on the codebase.
      # 0.20.2 parses deny.toml and runs all four checks; verified
      # locally 2026-10-15. Bump deliberately and re-run the full
      # check suite when you do.
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check licenses
        run: cargo deny check licenses

      - name: Check advisories
        run: cargo deny check advisories

      - name: Check bans
        run: cargo deny check bans

      - name: Check sources
        run: cargo deny check sources

  # ── Go module audit (if applicable) ────────────────────────────────
  go-audit:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.21"
          cache: false

      - name: Install govulncheck
        # Pin to v1.0.4: v1.1+ requires Go 1.22, and `GOTOOLCHAIN=local`
        # below prevents the auto-upgrade that would otherwise resolve it.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.0.4

      - name: Run govulncheck (capprobe)
        working-directory: cmd/capprobe
        run: govulncheck ./...

      - name: Run govulncheck (checker)
        working-directory: cmd/checker
        run: govulncheck ./...

      - name: Run govulncheck (wire)
        working-directory: cmd/wire
        run: govulncheck ./...
