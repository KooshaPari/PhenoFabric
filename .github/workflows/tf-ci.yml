name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # --- rust/ crate (tf-sync, tf-web) ---
      - name: Clippy (terminal-fabric-rs)
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy with self-update (terminal-fabric-rs)
        working-directory: rust
        run: cargo clippy --all-targets --features self-update -- -D warnings

      - name: Test (terminal-fabric-rs)
        working-directory: rust
        run: cargo test

      - name: Release build (terminal-fabric-rs)
        working-directory: rust
        run: cargo build --release --no-default-features

      - name: Release build with self-update (terminal-fabric-rs)
        working-directory: rust
        run: cargo build --release --features self-update

      # --- rust/windows-capture/ crate (tf-win-capture) ---
      - name: Clippy (tf-win-capture)
        working-directory: rust/windows-capture
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy with self-update (tf-win-capture)
        working-directory: rust/windows-capture
        run: cargo clippy --all-targets --features self-update -- -D warnings

      - name: Test (tf-win-capture)
        working-directory: rust/windows-capture
        run: cargo test

      - name: Release build (tf-win-capture)
        working-directory: rust/windows-capture
        run: cargo build --release

      - name: Release build with self-update (tf-win-capture)
        working-directory: rust/windows-capture
        run: cargo build --release --features self-update
