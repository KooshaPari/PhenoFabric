name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Cross-platform release builds ─────────────────────────────────────
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
            platform: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
            platform: linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-13
            archive_ext: tar.gz
            platform: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz
            platform: macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip
            platform: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: release-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ matrix.platform }}-

      # ── Linux dependencies ────────────────────────────────────────────
      - name: Install Linux GUI dependencies (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libxcb-render0-dev:arm64 \
            libxcb-shape0-dev:arm64 \
            libxcb-xfixes0-dev:arm64 \
            libxkbcommon-dev:arm64 \
            libwayland-dev:arm64
          sudo dpkg --add-architecture arm64

      - name: Set cross-compilation env (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      # ── Build ─────────────────────────────────────────────────────────
      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        shell: bash
        run: cargo build --workspace --release --bins --target ${{ matrix.target }}

      # ── Package ───────────────────────────────────────────────────────
      - name: Create archive (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          DIST="phenotype-fabric-${TAG}-${{ matrix.platform }}"
          TARGET_DIR="target/${{ matrix.target }}/release"
          mkdir -p "$DIST"

          for bin in fabric-daemon fabric-cli fabric-tui fabric-gui fabric-tray fabric-graph; do
            cp "$TARGET_DIR/$bin" "$DIST/" 2>/dev/null || true
          done
          cp LICENSE* "$DIST/" 2>/dev/null || true
          cp README.md "$DIST/" 2>/dev/null || true

          tar czf "${DIST}.tar.gz" "$DIST"
          echo "archive=${DIST}.tar.gz" >> "$GITHUB_ENV"

      - name: Create archive (Windows)
        if: matrix.archive_ext == 'zip'
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          DIST="phenotype-fabric-${TAG}-${{ matrix.platform }}"
          TARGET_DIR="target/${{ matrix.target }}/release"
          mkdir -p "$DIST"

          for bin in fabric-daemon fabric-cli fabric-tui fabric-gui fabric-tray fabric-graph; do
            cp "$TARGET_DIR/$bin.exe" "$DIST/" 2>/dev/null || true
          done
          cp LICENSE* "$DIST/" 2>/dev/null || true
          cp README.md "$DIST/" 2>/dev/null || true

          7z a "${DIST}.zip" "$DIST"
          echo "archive=${DIST}.zip" >> "$GITHUB_ENV"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.archive }}
          retention-days: 3

  # ── Create GitHub Release ───────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download all archive artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*"
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*

  # ── Publish library crates to crates.io ─────────────────────────────
  publish-crates:
    name: Publish crates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Publish fabric-graph
        run: cargo publish -p fabric-graph --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish fabric-capability
        run: cargo publish -p fabric-capability --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish fabric-workspace
        run: cargo publish -p fabric-workspace --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish fabric-persist
        run: cargo publish -p fabric-persist --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  # ── Docker image ────────────────────────────────────────────────────
  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
