name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Build release binaries ──────────────────────────────────────────
  build:
    name: Build linux-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: release-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        run: cargo build --workspace --release --bins

      - name: Create archive
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          DIST="phenotype-fabric-${TAG}-linux-x86_64"
          mkdir -p "$DIST"

          cp target/release/fabric-daemon  "$DIST/" 2>/dev/null || true
          cp target/release/fabric-cli     "$DIST/" 2>/dev/null || true
          cp target/release/fabric-tui     "$DIST/" 2>/dev/null || true
          cp target/release/fabric-gui     "$DIST/" 2>/dev/null || true
          cp target/release/fabric-tray    "$DIST/" 2>/dev/null || true
          cp target/release/fabric-graph   "$DIST/" 2>/dev/null || true
          cp LICENSE* "$DIST/" 2>/dev/null || true
          cp README.md "$DIST/" 2>/dev/null || true

          tar czf "${DIST}.tar.gz" "$DIST"
          echo "archive=${DIST}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: ${{ env.archive }}
          retention-days: 3

  # ── Create GitHub Release ───────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Download archive artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-x86_64

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: "*.tar.gz"

  # ── Docker image ────────────────────────────────────────────────────
  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
