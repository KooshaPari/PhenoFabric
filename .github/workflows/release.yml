name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm (workflow will require environment approval regardless)'
        required: true
        default: ''
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REGISTRY: ghcr.io
  # GHCR requires lowercase repository names; github.repository
  # is "KooshaPari/PhenoFabric" (mixed case) which Docker rejects.
  # GitHub Actions has no lowercase() expression function, so we
  # hardcode the lowercase form. Update this if the repo is renamed.
  IMAGE_NAME: kooshapari/phenofabric

jobs:
  # ── Cross-platform CLI binary builds ─────────────────────────────────
  build:
    name: Build CLI ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
            platform: linux-x86_64
          # linux-aarch64 disabled: GitHub-hosted ubuntu-latest runners
          # (canadaeast) cannot reach the arm64 package indexes
          # (security.ubuntu.com and azure.archive.ubuntu.com both 404
          # on /dists/noble/{main,universe,...}/binary-arm64/Packages).
          # Re-enable when a fix is available, or move to ubuntu-24.04-arm
          # native arm64 runner. See session 2026-10-15-v012-retag-and-build-debt.
          - target: x86_64-apple-darwin
            os: macos-13
            archive_ext: tar.gz
            platform: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz
            platform: macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip
            platform: windows-x86_64

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: release-cli-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-cli-${{ matrix.platform }}-

      # ── Linux dependencies ────────────────────────────────────────────
      - name: Install Linux build dependencies (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: ./.github/actions/linux-build-deps
        with:
          arch: host

      - name: Install Linux build dependencies (aarch64 cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: ./.github/actions/linux-build-deps
        with:
          arch: arm64

      - name: Set cross-compilation env (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      # ── Build ─────────────────────────────────────────────────────────
      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        shell: bash
        run: cargo build --workspace --release --bins --target ${{ matrix.target }}

      # ── Package ───────────────────────────────────────────────────────
      - name: Create archive (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          DIST="phenotype-fabric-${TAG}-${{ matrix.platform }}"
          TARGET_DIR="target/${{ matrix.target }}/release"
          mkdir -p "$DIST"

          for bin in fabric-daemon fabric-cli fabric-tui fabric-tray fabric-graph; do
            cp "$TARGET_DIR/$bin" "$DIST/" 2>/dev/null || true
          done
          cp LICENSE* "$DIST/" 2>/dev/null || true
          cp README.md "$DIST/" 2>/dev/null || true

          tar czf "${DIST}.tar.gz" "$DIST"
          echo "archive=${DIST}.tar.gz" >> "$GITHUB_ENV"

      - name: Create archive (Windows)
        if: matrix.archive_ext == 'zip'
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          DIST="phenotype-fabric-${TAG}-${{ matrix.platform }}"
          TARGET_DIR="target/${{ matrix.target }}/release"
          mkdir -p "$DIST"

          for bin in fabric-daemon fabric-cli fabric-tui fabric-tray fabric-graph; do
            cp "$TARGET_DIR/$bin.exe" "$DIST/" 2>/dev/null || true
          done
          cp LICENSE* "$DIST/" 2>/dev/null || true
          cp README.md "$DIST/" 2>/dev/null || true

          7z a "${DIST}.zip" "$DIST"
          echo "archive=${DIST}.zip" >> "$GITHUB_ENV"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.platform }}
          path: ${{ env.archive }}
          retention-days: 3

  # ── Cross-platform Tauri GUI builds ──────────────────────────────────
  build-gui:
    name: Build GUI ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos-arm64
          - target: x86_64-apple-darwin
            os: macos-13
            platform: macos-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows-x64

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/fabric-gui/src-tauri/target
          key: release-gui-${{ matrix.platform }}-${{ hashFiles('crates/fabric-gui/src-tauri/Cargo.lock') }}
          restore-keys: release-gui-${{ matrix.platform }}-

      # ── Linux system dependencies (WebKit2GTK, AppIndicator, etc.) ───
      - name: Install Linux build dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: ./.github/actions/linux-build-deps
        with:
          arch: host

      # ── Install Node.js (required by Tauri CLI) ──────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # ── Install Tauri CLI v2 ─────────────────────────────────────────
      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2" --locked

      # ── Build Tauri bundles ───────────────────────────────────────────
      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build Tauri bundle
        shell: bash
        working-directory: crates/fabric-gui/src-tauri
        run: |
          # Tauri uses tauri.conf.json's "version" for bundle filenames and
          # .deb/.rpm package versions. Strip the leading 'v' from the tag
          # and pass via env var so the bundle picks up the released version
          # (the file's hard-coded "0.1.0-nightly" has invalid characters for
          # Tauri reads the version from tauri.conf.json. Inject the release
          # tag at build time via --config so deb/rpm/msi/nsis/dmg package
          # versions are sourced from the tag rather than the workspace
          # version (e.g. 0.1.0-nightly, which fails Debian/RPM version
          # spec validation). The Tauri CLI merges this JSON over the
          # existing config, so the "version" key on the root is replaced.
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          cargo tauri build --target ${{ matrix.target }} --config "{\"version\": \"${TAG_VERSION}\"}"

      # ── Collect macOS artifacts ───────────────────────────────────────
      - name: Collect macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        working-directory: crates/fabric-gui/src-tauri
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          STAGE="${RUNNER_TEMP}/gui-artifacts"
          mkdir -p "$STAGE"

          # DMG
          DMG=$(find "$BUNDLE_DIR/dmg" -name "*.dmg" -print -quit 2>/dev/null || true)
          if [ -n "$DMG" ]; then
            cp "$DMG" "$STAGE/phenotype-fabric-gui-${{ matrix.platform }}.dmg"
          fi

          # .app as fallback / extra artifact
          APP_DIR="$BUNDLE_DIR/macos"
          if [ -d "$APP_DIR" ]; then
            APP_NAME=$(find "$APP_DIR" -maxdepth 1 -name "*.app" -print -quit 2>/dev/null || true)
            if [ -n "$APP_NAME" ]; then
              ditto -c -k --sequesterRsrc --keepParent "$(basename "$APP_NAME")" "$STAGE/phenotype-fabric-gui-${{ matrix.platform }}.app.zip" 2>/dev/null || true
            fi
          fi

          echo "gui_artifacts_dir=$STAGE" >> "$GITHUB_ENV"
          ls -la "$STAGE"

      # ── Collect Linux artifacts ───────────────────────────────────────
      - name: Collect Linux artifacts
        if: runner.os == 'Linux'
        shell: bash
        working-directory: crates/fabric-gui/src-tauri
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          STAGE="${RUNNER_TEMP}/gui-artifacts"
          mkdir -p "$STAGE"

          # .deb
          DEB=$(find "$BUNDLE_DIR/deb" -name "*.deb" -print -quit 2>/dev/null || true)
          if [ -n "$DEB" ]; then
            cp "$DEB" "$STAGE/phenotype-fabric-gui-${{ matrix.platform }}.deb"
          fi

          # .AppImage
          APPIMAGE=$(find "$BUNDLE_DIR/appimage" -name "*.AppImage" -print -quit 2>/dev/null || true)
          if [ -n "$APPIMAGE" ]; then
            cp "$APPIMAGE" "$STAGE/phenotype-fabric-gui-${{ matrix.platform }}.AppImage"
            chmod +x "$STAGE/phenotype-fabric-gui-${{ matrix.platform }}.AppImage"
          fi

          echo "gui_artifacts_dir=$STAGE" >> "$GITHUB_ENV"
          ls -la "$STAGE"

      # ── Collect Windows artifacts ─────────────────────────────────────
      - name: Collect Windows artifacts
        if: runner.os == 'Windows'
        shell: bash
        working-directory: crates/fabric-gui/src-tauri
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          STAGE="${RUNNER_TEMP}/gui-artifacts"
          mkdir -p "$STAGE"

          # .msi
          MSI=$(find "$BUNDLE_DIR/msi" -name "*.msi" -print -quit 2>/dev/null || true)
          if [ -n "$MSI" ]; then
            cp "$MSI" "$STAGE/phenotype-fabric-gui-${{ matrix.platform }}.msi"
          fi

          # .exe (NSIS installer)
          EXE=$(find "$BUNDLE_DIR/nsis" -name "*.exe" -print -quit 2>/dev/null || true)
          if [ -n "$EXE" ]; then
            cp "$EXE" "$STAGE/phenotype-fabric-gui-${{ matrix.platform }}.exe"
          fi

          echo "gui_artifacts_dir=$STAGE" >> "$GITHUB_ENV"
          ls -la "$STAGE"

      # ── Upload GUI artifact ───────────────────────────────────────────
      - name: Upload GUI artifact
        uses: actions/upload-artifact@v7
        with:
          name: gui-${{ matrix.platform }}
          path: ${{ env.gui_artifacts_dir }}/*
          if-no-files-found: error
          retention-days: 3

  # ── cargo-deny gate (must pass before publish-crates or docker) ────
  deny:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check advisories
        run: cargo deny check advisories

  # ── Build identity (stable SHA over Cargo.lock, matrix-free) ──────
  identity:
    name: Build identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Compute build identity
        id: identity
        run: |
          IDENTITY=$(sha256sum Cargo.lock | cut -d' ' -f1 | cut -c1-12)
          echo "identity=${IDENTITY}" >> "$GITHUB_OUTPUT"
          echo "Build identity: ${IDENTITY}"
    outputs:
      identity: ${{ steps.identity.outputs.identity }}

  # ── Build Docker image once (matrix-free), push from artifact ────────
  # Closes the docker half of gap 1 (exact-byte-promotion). The image is
  # built in this job and saved as a tar artifact; the downstream `docker`
  # job only loads and pushes. This guarantees the published image bytes
  # are the ones built here, not a fresh rebuild in a different runner.
  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [deny, identity]
    outputs:
      identity: ${{ needs.identity.outputs.identity }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Verify lockfile matches build identity
        run: |
          ACTUAL=$(sha256sum Cargo.lock | cut -d' ' -f1 | cut -c1-12)
          EXPECTED="${{ needs.identity.outputs.identity }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Lockfile SHA mismatch: actual=$ACTUAL expected=$EXPECTED"
            exit 1
          fi
          echo "Lockfile SHA matches build identity: $ACTUAL"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag for build identity
        id: tags
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          IDENTITY_TAG="build-${{ needs.identity.outputs.identity }}"
          echo "primary=${TAG}" >> "$GITHUB_OUTPUT"
          echo "identity=${IDENTITY_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build image (load to local, do not push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.primary }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image to tar
        run: |
          docker save \
            -o phenotype-fabric-image.tar \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.primary }}
          ls -la phenotype-fabric-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: phenotype-fabric-image.tar
          retention-days: 1
          if-no-files-found: error

  # ── Create GitHub Release ───────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, build-gui, identity]
    steps:
      - uses: actions/checkout@v7

      - name: Download all archive artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "*"
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create release body
        id: body
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cat > release_body.md << 'BODY_EOF'
          ## CLI Binaries

          | Platform | Archive |
          |----------|---------|
          | Linux x86_64 | `phenotype-fabric-TAG-linux-x86_64.tar.gz` |
          | macOS x64 | `phenotype-fabric-TAG-macos-x86_64.tar.gz` |
          | macOS ARM64 | `phenotype-fabric-TAG-macos-aarch64.tar.gz` |
          | Windows x64 | `phenotype-fabric-TAG-windows-x86_64.zip` |

          > Linux aarch64 cross-build is currently disabled because
          > GitHub-hosted runners in canadaeast cannot reach the
          > arm64 package indexes (security/archive mirrors 404 on
          > /dists/noble/.../binary-arm64/Packages). Re-enable when
          > the environment issue is resolved.

          ## Desktop GUI

          | Platform | Installer |
          |----------|-----------|
          | macOS ARM64 | `phenotype-fabric-gui-macos-arm64.dmg` |
          | macOS x64 | `phenotype-fabric-gui-macos-x64.dmg` |
          | Linux x64 | `phenotype-fabric-gui-linux-x64.deb` |
          | Linux x64 | `phenotype-fabric-gui-linux-x64.AppImage` |
          | Windows x64 | `phenotype-fabric-gui-windows-x64.msi` |

          ## Build Identity

          This release was built from a commit with the following Cargo.lock SHA-256 prefix (first 12 chars):

          `BUILD_IDENTITY_PLACEHOLDER`

          The Docker image is also tagged with this identity as `build-BUILD_IDENTITY_PLACEHOLDER` for cross-reference.
          BODY_EOF
          sed -i "s/TAG/${TAG}/g" release_body.md
          sed -i "s/BUILD_IDENTITY_PLACEHOLDER/${{ needs.identity.outputs.identity }}/g" release_body.md
          cat release_body.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: release_body.md
          files: artifacts/*

  # ── Publish library crates to crates.io ─────────────────────────────
  publish-crates:
    name: Publish crates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deny, identity]
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Record build identity
        env:
          BUILD_IDENTITY: ${{ needs.identity.outputs.identity }}
        run: |
          echo "Publishing crates for build identity: ${BUILD_IDENTITY}"
          # Note: BUILD_IDENTITY is already exported by the env: block
          # above; do NOT echo it into GITHUB_ENV — GITHUB_ENV requires
          # strict KEY=VALUE format and rejects lines like
          # "Build identity: abc123".

      - name: Verify lockfile matches build identity
        run: |
          ACTUAL=$(sha256sum Cargo.lock | cut -d' ' -f1 | cut -c1-12)
          EXPECTED="${{ needs.identity.outputs.identity }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Lockfile SHA mismatch: actual=$ACTUAL expected=$EXPECTED"
            exit 1
          fi
          echo "Lockfile SHA matches build identity: $ACTUAL"

      # Publish order must respect the workspace dependency graph.
      # fabric-capability is a leaf (no internal deps), so publish it first.
      # Then fabric-graph, then the consumers (fabric-workspace, fabric-persist).
      # This avoids "no matching package found" errors when cargo validates
      # the path-dep version requirements at publish time.
      - name: Publish fabric-capability
        run: cargo publish -p fabric-capability --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish fabric-graph
        run: cargo publish -p fabric-graph --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish fabric-workspace
        run: cargo publish -p fabric-workspace --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish fabric-persist
        run: cargo publish -p fabric-persist --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  # ── Docker image (load from artifact built by docker-build, then push) ──
  docker:
    name: Push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [docker-build]
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Download pre-built image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load pre-built image from tar
        run: |
          docker load -i phenotype-fabric-image.tar
          docker images
          ls -la phenotype-fabric-image.tar

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=build-${{ needs.docker-build.outputs.identity }}

      - name: Retag image with build identity tag
        run: |
          PRIMARY="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          docker tag "$PRIMARY" "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ needs.docker-build.outputs.identity }}"
          echo "Tagged image with all metadata tags"

      - name: Push image with all tags
        run: |
          docker push --all-tags "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

  # ── Post-publish verification ────────────────────────────────────────
  verify:
    name: Post-publish verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [github-release, publish-crates, docker, identity]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Download GH release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          mkdir -p release-assets
          gh release download "$TAG" --dir release-assets --pattern "*"
          echo "::group::Downloaded assets"
          find release-assets -type f | sort
          echo "::endgroup::"

      - name: Verify all 4 CLI archives present
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          missing=0
          for platform in linux-x86_64 macos-x86_64 macos-aarch64 windows-x86_64; do
            if [ "$platform" = "windows-x86_64" ]; then
              ext="zip"
            else
              ext="tar.gz"
            fi
            expected="phenotype-fabric-${TAG}-${platform}.${ext}"
            if [ ! -f "release-assets/${expected}" ]; then
              echo "::error::Missing CLI asset: ${expected}"
              missing=1
            else
              echo "OK ${expected}"
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::One or more CLI assets missing from GH release"
            exit 1
          fi

      - name: Verify Docker image is pullable
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          IDENTITY_TAG="build-${{ needs.identity.outputs.identity }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          IDENTITY_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IDENTITY_TAG}"
          echo "Pulling $IMAGE"
          docker pull --quiet "$IMAGE" || { echo "::error::Docker image not found: $IMAGE"; exit 1; }
          echo "OK Docker image present: $IMAGE"
          echo "Pulling $IDENTITY_IMAGE"
          docker pull --quiet "$IDENTITY_IMAGE" || { echo "::error::Build-identity image not found: $IDENTITY_IMAGE"; exit 1; }
          echo "OK Build-identity image present: $IDENTITY_IMAGE"
