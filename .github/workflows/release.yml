name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm a dispatch. Any other value fails the run before anything is built. Tag pushes do not set this input, so the check does not apply to them.'
        required: true
        default: ''
      version:
        description: >-
          Version to publish, e.g. "v0.1.7". Leave empty for a tag push.
          Set it to republish an existing tag from a newer commit: the
          release then names that version while building the code at the
          dispatched ref. The tag itself is never moved.
        required: false
        default: ''
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REGISTRY: ghcr.io
  # GHCR requires lowercase repository names; github.repository
  # is "KooshaPari/PhenoFabric" (mixed case) which Docker rejects.
  # GitHub Actions has no lowercase() expression function, so we
  # hardcode the lowercase form. Update this if the repo is renamed.
  IMAGE_NAME: kooshapari/phenofabric

jobs:
  # ── Cross-platform CLI binary builds ─────────────────────────────────
  build:
    name: Build CLI ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # macos-x86_64 builds previously ran on the macos-13 runner
    # image, which was retired 2025-09-19. The workflow now uses
    # macos-15-intel (see matrix include below).
    #
    # macOS x86_64 is a REQUIRED release platform, so this job is a
    # hard gate: there is no `continue_on_error` opt-in any more. The
    # previous best-effort marker was a leftover from when macos-13
    # did not exist and the x86_64 build could not run at all; it
    # predates the runner retirement being fixed.
    #
    # The release itself was already fail-closed for this platform --
    # the `github-release` job requires
    # `phenotype-fabric-${TAG}-macos-x86_64.tar.gz` to be present and
    # refuses to publish without it -- but the failure surfaced there,
    # as a missing-asset error in the release job, rather than at the
    # build that actually broke. v0.1.6 (2026-10-21) published the
    # macOS x86_64 CLI archive AND the macOS x86_64 GUI .dmg from
    # macos-15-intel, so the platform is demonstrably buildable and
    # the exemption is not needed.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
            platform: linux-x86_64
          # linux-aarch64 is built NATIVELY on a `ubuntu-24.04-arm`
          # runner (native arm64 hosted runners are free for public
          # repositories).
          #
          # It was previously disabled because the x86_64 `ubuntu-latest`
          # runner cannot reach the arm64 package indexes. The
          # root cause was NOT a mirror outage, and the previous
          # comment in this file got it wrong: `archive.ubuntu.com`
          # does not publish `binary-arm64` AT ALL -- it returns 404
          # for that path permanently. arm64 packages live on a
          # separate mirror, `ports.ubuntu.com/ubuntu-ports`, which
          # serves `dists/noble/main/binary-arm64/Packages.gz` with
          # HTTP 200 (verified 2026-10-22).
          #
          # GitHub's own ARM64 runner image uses that mirror: see
          # actions/runner-images `images/ubuntu/scripts/build/configure-apt.sh`,
          # which says "22.04 and 24.04 arm64 ... are served by
          # ports.ubuntu.com, which the mirror list does not cover".
          # So on a native `ubuntu-24.04-arm` runner apt already
          # points at the mirror that carries arm64 packages, and no
          # `dpkg --add-architecture arm64` cross-compile dance is
          # needed.
          #
          # All 11 required build dependencies were confirmed present
          # in the noble arm64 indexes (main + universe) on
          # 2026-10-22.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive_ext: tar.gz
            platform: linux-aarch64
          # macos-13 (x86_64) was retired 2025-09-19; replacement
          # is macos-15-intel. (Observed 2026-10-15: macos-13 jobs
          # were stuck queued for 21+ hours — the runner image no
          # longer exists, but GitHub didn't error out, it just never
          # matched a runner.) Use macos-15-intel so the job actually
          # starts. macOS x86_64 is a REQUIRED platform, so this entry
          # deliberately has no `continue_on_error` marker: a failure
          # here must fail the release, not skip it.
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive_ext: tar.gz
            platform: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz
            platform: macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip
            platform: windows-x86_64

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: release-cli-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-cli-${{ matrix.platform }}-

      # ── Linux dependencies ────────────────────────────────────────────
      - name: Install Linux build dependencies (native host)
        # On a native runner -- including `ubuntu-24.04-arm` -- the
        # host IS the target architecture. The packages are installed
        # with no architecture suffix: apt only accepts an explicit
        # `:arch` suffix for a FOREIGN architecture, so `libgtk-3-dev:arm64`
        # is rejected on an arm64 host.
        #
        # The composite action installs the plain package names, which is
        # exactly what a native arm64 host needs.
        if: startsWith(matrix.target, 'x86_64-unknown-linux-gnu') || startsWith(matrix.target, 'aarch64-unknown-linux-gnu')
        uses: ./.github/actions/linux-build-deps

      # ── Build ─────────────────────────────────────────────────────────
      - name: Extract version from tag
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          source scripts/release/resolve_version.sh
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "docker_tag=${RELEASE_DOCKER_TAG}" >> "$GITHUB_OUTPUT"

      # ── Version consistency ───────────────────────────────────────────
      # A released binary must report the version it was released as. v0.1.7
      # shipped binaries that answer `fabric --version` with "0.1.0": every
      # binary prints env!("CARGO_PKG_VERSION") and [workspace.package] version
      # was never bumped past 0.1.0. Verified 2026-10-30 by downloading the
      # published v0.1.7 macOS-arm64 tarball and running all five binaries.
      #
      # It is not cosmetic. crates/fabric-terminal/src/self_update.rs compares
      # env!("CARGO_PKG_VERSION") against the release tag with 'v' stripped, so
      # it read 0.1.0 against 0.1.7, concluded an update was always available,
      # and after updating still reported 0.1.0 - it could never converge.
      #
      # This gate is fail-closed and sits before the build, so a tag bumped
      # without bumping Cargo.toml can never publish again.
      #
      # It checks the EFFECTIVE version of every released binary crate, not
      # just [workspace.package]. The first version of this gate only compared
      # the workspace version, which was a hole: three of the five released
      # binaries do not inherit it.
      #
      #   fabric-cli        version = "0.1.0"          -> bin `fabric`
      #   fabric-tui        version = "0.1.0"          -> bin `fabric-tui`
      #   fabric-tray       version = "0.1.0"          -> bin `fabric-tray`
      #   fabric-graph-cli  version.workspace = true   -> bin `fabric-graph-cli`
      #   fabric-daemon     version.workspace = true   -> bin `fabric-daemon`
      #
      # So bumping only [workspace.package] to 0.1.8 would have made this gate
      # PASS while three of the five binaries still reported 0.1.0 - the exact
      # bug the gate exists to prevent. cargo metadata resolves inheritance and
      # hardcoded versions into the value each crate actually compiles with,
      # so that is what the gate compares.
      - name: Verify every released binary reports the release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          scripts/check-release-version.sh "$RELEASE_VERSION"

      - name: Build release binaries
        shell: bash
        run: cargo build --workspace --release --bins --target ${{ matrix.target }}

      # ── Runtime acceptance on the native runner ─────────────────────
      # A binary that COMPILES is not a binary that WORKS. The step
      # below used to be the only existence check, so a macOS or
      # Windows artifact with a broken link, a missing runtime library,
      # or a startup panic would be published with a green checkmark.
      # This runs the real binaries on the runner that natively hosts
      # the target platform, so the artifact that ships is proven to
      # start before it ships.
      #
      # The script also exercises the daemon end to end (start ->
      # health -> stop) using the same `health` probe the container
      # HEALTHCHECK uses. That is the exact path that was broken in
      # v0.1.5, so it must be proven on every platform, not just Linux.
      - name: Verify the built binaries run on this platform
        shell: bash
        run: |
          scripts/acceptance/binary_acceptance.sh \
            "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release"

      # Guard the packaging step below: assert every EXPECTED release binary
      # exists (and is executable on Unix) BEFORE any archive is created.
      # Historically a wrong bin name in the copy loop (e.g. "fabric-cli"
      # instead of the real [[bin]] "fabric") made `cp` fail, but the
      # `2>/dev/null || true` swallowed it -- the archive shipped without
      # the binary and CI stayed green. This step fails loudly and names the
      # real target names so the defect cannot recur silently.
      #
      # EXPECTED_RELEASE_BINS is the single source of truth for the CLI
      # release contents. Keep it in sync with both packaging loops below.
      - name: Assert expected release binaries exist
        shell: bash
        env:
          EXPECTED_RELEASE_BINS: fabric-daemon fabric fabric-tui fabric-tray fabric-graph-cli
        run: |
          TARGET_DIR="target/${{ matrix.target }}/release"
          missing=0
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            suffix=".exe"
          else
            suffix=""
          fi
          for bin in $EXPECTED_RELEASE_BINS; do
            path="${TARGET_DIR}/${bin}${suffix}"
            if [ ! -f "$path" ]; then
              echo "::error::Expected release binary not found: $path"
              echo "::error::Is '$bin' a real cargo [[bin]] target? Check: cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; [print(t[\"name\"]) for p in json.load(sys.stdin)[\"packages\"] for t in p[\"targets\"] if \"bin\" in t[\"kind\"]]'"
              missing=1
              continue
            fi
            # On Unix the archives must ship runnable binaries; on Windows
            # the .exe carries no POSIX exec bit, so only check -x there-free.
            if [ -z "$suffix" ] && [ ! -x "$path" ]; then
              echo "::error::Release binary is not executable: $path"
              missing=1
              continue
            fi
            echo "OK release binary: $path"
          done
          if [ "$missing" = "1" ]; then
            echo "::error::One or more expected release binaries are missing; refusing to package a partial release."
            exit 1
          fi
          echo "All expected release binaries present: $EXPECTED_RELEASE_BINS"

      # ── Package ───────────────────────────────────────────────────────
      - name: Create archive (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          DIST="phenotype-fabric-${TAG}-${{ matrix.platform }}"
          TARGET_DIR="target/${{ matrix.target }}/release"
          mkdir -p "$DIST"

          # Binaries that MUST be present in every CLI release archive.
          # These names are the real cargo target names (verify against
          # `cargo metadata` [[bin]] names); a name that is not a target
          # name (e.g. "fabric-cli" instead of "fabric", or "fabric-graph"
          # instead of "fabric-graph-cli") makes the copy below fail. We do
          # NOT swallow that error anymore -- a missing expected binary must
          # fail the release, not be silently skipped.
          for bin in fabric-daemon fabric fabric-tui fabric-tray fabric-graph-cli; do
            if [ ! -x "$TARGET_DIR/$bin" ]; then
              echo "::error::Expected release binary missing or not executable: $TARGET_DIR/$bin"
              exit 1
            fi
            cp "$TARGET_DIR/$bin" "$DIST/"
          done
          # LICENSE* and README.md are optional supporting files: ship them
          # when present, but never fail the release because they're absent.
          cp LICENSE* "$DIST/" 2>/dev/null || true
          cp README.md "$DIST/" 2>/dev/null || true

          tar czf "${DIST}.tar.gz" "$DIST"
          echo "archive=${DIST}.tar.gz" >> "$GITHUB_ENV"

      - name: Create archive (Windows)
        if: matrix.archive_ext == 'zip'
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          DIST="phenotype-fabric-${TAG}-${{ matrix.platform }}"
          TARGET_DIR="target/${{ matrix.target }}/release"
          mkdir -p "$DIST"

          # Same expected-binary set as the Unix archive (see the comment
          # above); names are the real cargo [[bin]] target names, and a
          # missing expected binary fails the release instead of being skipped.
          for bin in fabric-daemon fabric fabric-tui fabric-tray fabric-graph-cli; do
            if [ ! -f "$TARGET_DIR/$bin.exe" ]; then
              echo "::error::Expected release binary missing: $TARGET_DIR/$bin.exe"
              exit 1
            fi
            cp "$TARGET_DIR/$bin.exe" "$DIST/"
          done
          # LICENSE* and README.md are optional supporting files (see above).
          cp LICENSE* "$DIST/" 2>/dev/null || true
          cp README.md "$DIST/" 2>/dev/null || true

          7z a "${DIST}.zip" "$DIST"
          echo "archive=${DIST}.zip" >> "$GITHUB_ENV"

      # ── Checksum ─────────────────────────────────────────────────────
      # Publish a SHA-256 for every archive so a user can verify what
      # they downloaded. No release before v0.1.7 shipped any checksum
      # at all, which left users unable to detect a truncated or
      # corrupted download.
      #
      # The checksum file is named after the archive, so it lands in the
      # same artifact upload and reaches the release page alongside the
      # file it describes.
      - name: Generate archive checksum
        shell: bash
        run: |
          ARCHIVE="${{ env.archive }}"
          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Archive not found for checksum: $ARCHIVE"
            exit 1
          fi
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          cat "${ARCHIVE}.sha256"
          echo "checksum=${ARCHIVE}.sha256" >> "$GITHUB_ENV"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.platform }}
          # Upload the archive AND its checksum. Both are needed: the
          # archive is the artifact, the checksum is how a user proves
          # the download is intact.
          path: |
            ${{ env.archive }}
            ${{ env.checksum }}
          retention-days: 3

  # ── Cross-platform Tauri GUI builds ──────────────────────────────────
  build-gui:
    name: Build GUI ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # macos-x64 GUI ran on the retired macos-13 image; the workflow
    # now uses macos-15-intel. macOS x86_64 is a REQUIRED release
    # platform, so this job is a hard gate: the previous best-effort
    # marker predated the runner retirement being fixed and predates
    # the `github-release` job's required-asset check for
    # `phenotype-fabric-gui-macos-x64.dmg`.
    #
    # v0.1.6 (2026-10-21) published the macOS x86_64 GUI .dmg from
    # macos-15-intel, so the platform is demonstrably buildable.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos-arm64
          # macos-13 (x86_64) was retired 2025-09-19; replacement
          # is macos-15-intel. See CLI build matrix for context.
          # macOS x86_64 is a REQUIRED platform, so this entry
          # deliberately has no `continue_on_error` marker: a failure
          # here must fail the release, not skip it.
          - target: x86_64-apple-darwin
            os: macos-15-intel
            platform: macos-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows-x64

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/fabric-gui/src-tauri/target
          key: release-gui-${{ matrix.platform }}-${{ hashFiles('crates/fabric-gui/src-tauri/Cargo.lock') }}
          restore-keys: release-gui-${{ matrix.platform }}-

      # ── Linux system dependencies (WebKit2GTK, AppIndicator, etc.) ───
      - name: Install Linux build dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: ./.github/actions/linux-build-deps

      # ── Install Node.js (required by Tauri CLI) ──────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # ── Install Tauri CLI v2 ─────────────────────────────────────────
      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2" --locked

      # ── Build Tauri bundles ───────────────────────────────────────────
      - name: Extract version from tag
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          source scripts/release/resolve_version.sh
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "docker_tag=${RELEASE_DOCKER_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build Tauri bundle
        shell: bash
        working-directory: crates/fabric-gui/src-tauri
        run: |
          # Tauri uses tauri.conf.json's "version" for bundle filenames and
          # .deb/.rpm package versions. Strip the leading 'v' from the tag
          # and pass via env var so the bundle picks up the released version
          # (the file's hard-coded "0.1.0-nightly" has invalid characters for
          # Tauri reads the version from tauri.conf.json. Inject the release
          # tag at build time via --config so deb/rpm/msi/nsis/dmg package
          # versions are sourced from the tag rather than the workspace
          # version (e.g. 0.1.0-nightly, which fails Debian/RPM version
          # spec validation). The Tauri CLI merges this JSON over the
          # existing config, so the "version" key on the root is replaced.
          #
          # The version comes from the RESOLVED tag, not from GITHUB_REF.
          # On a dispatch, GITHUB_REF is refs/heads/<branch>, and stripping
          # "refs/tags/v" from it leaves "refs/heads/main" -- which is not a
          # version and fails Debian/RPM version spec validation. The
          # resolved tag is the same value the artifact filenames use, so
          # the bundle version and the published filename cannot disagree.
          TAG_VERSION="${{ steps.version.outputs.version }}"
          cargo tauri build --target ${{ matrix.target }} --config "{\"version\": \"${TAG_VERSION}\"}"

      # ── Collect macOS artifacts ───────────────────────────────────────
      - name: Collect macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        working-directory: crates/fabric-gui/src-tauri
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          STAGE="${RUNNER_TEMP}/gui-artifacts"
          mkdir -p "$STAGE"

          # DMG
          DMG=$(find "$BUNDLE_DIR/dmg" -name "*.dmg" -print -quit 2>/dev/null || true)
          if [ -n "$DMG" ]; then
            cp "$DMG" "$STAGE/phenotype-fabric-gui-${{ matrix.platform }}.dmg"
          fi

          # .app as fallback / extra artifact
          APP_DIR="$BUNDLE_DIR/macos"
          if [ -d "$APP_DIR" ]; then
            APP_NAME=$(find "$APP_DIR" -maxdepth 1 -name "*.app" -print -quit 2>/dev/null || true)
            if [ -n "$APP_NAME" ]; then
              ditto -c -k --sequesterRsrc --keepParent "$(basename "$APP_NAME")" "$STAGE/phenotype-fabric-gui-${{ matrix.platform }}.app.zip" 2>/dev/null || true
            fi
          fi

          echo "gui_artifacts_dir=$STAGE" >> "$GITHUB_ENV"
          ls -la "$STAGE"

      # ── Collect Linux artifacts ───────────────────────────────────────
      - name: Collect Linux artifacts
        if: runner.os == 'Linux'
        shell: bash
        working-directory: crates/fabric-gui/src-tauri
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          STAGE="${RUNNER_TEMP}/gui-artifacts"
          mkdir -p "$STAGE"

          # .deb
          DEB=$(find "$BUNDLE_DIR/deb" -name "*.deb" -print -quit 2>/dev/null || true)
          if [ -n "$DEB" ]; then
            cp "$DEB" "$STAGE/phenotype-fabric-gui-${{ matrix.platform }}.deb"
          fi

          # .AppImage
          APPIMAGE=$(find "$BUNDLE_DIR/appimage" -name "*.AppImage" -print -quit 2>/dev/null || true)
          if [ -n "$APPIMAGE" ]; then
            cp "$APPIMAGE" "$STAGE/phenotype-fabric-gui-${{ matrix.platform }}.AppImage"
            chmod +x "$STAGE/phenotype-fabric-gui-${{ matrix.platform }}.AppImage"
          fi

          echo "gui_artifacts_dir=$STAGE" >> "$GITHUB_ENV"
          ls -la "$STAGE"

      # ── Collect Windows artifacts ─────────────────────────────────────
      - name: Collect Windows artifacts
        if: runner.os == 'Windows'
        shell: bash
        working-directory: crates/fabric-gui/src-tauri
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          STAGE="${RUNNER_TEMP}/gui-artifacts"
          mkdir -p "$STAGE"

          # .msi
          MSI=$(find "$BUNDLE_DIR/msi" -name "*.msi" -print -quit 2>/dev/null || true)
          if [ -n "$MSI" ]; then
            cp "$MSI" "$STAGE/phenotype-fabric-gui-${{ matrix.platform }}.msi"
          fi

          # .exe (NSIS installer)
          EXE=$(find "$BUNDLE_DIR/nsis" -name "*.exe" -print -quit 2>/dev/null || true)
          if [ -n "$EXE" ]; then
            cp "$EXE" "$STAGE/phenotype-fabric-gui-${{ matrix.platform }}.exe"
          fi

          echo "gui_artifacts_dir=$STAGE" >> "$GITHUB_ENV"
          ls -la "$STAGE"

      # The release job refuses to publish unless EVERY entry in
      # SHA256SUMS has a `<artifact>.sha256` sidecar, and SHA256SUMS
      # covers GUI installers as well as CLI archives. The GUI job used
      # to upload .dmg/.deb/.AppImage/.msi/.exe with no sidecar at all,
      # so that gate could never pass -- the release was structurally
      # unable to succeed. Fixing it at the source (generate the sidecar
      # where the installer is produced) keeps one rule for both paths
      # instead of carving an installer exemption out of the gate.
      #
      # Every installer this runner actually produced gets a sidecar,
      # not just the first match: Linux ships BOTH a .deb and an
      # .AppImage and Windows ships BOTH a .msi and a .exe, and the
      # manifest requires a sidecar for each of them. A single-file
      # sidecar would leave the second installer to fail validation.
      - name: Generate installer checksums
        shell: bash
        run: |
          STAGE="${{ env.gui_artifacts_dir }}"
          if [ -z "$STAGE" ] || [ ! -d "$STAGE" ]; then
            echo "::error::gui_artifacts_dir is unset or missing: '$STAGE'"
            exit 1
          fi
          # The extension list mirrors the release job's SHA256SUMS
          # find expression. A GUI installer type that exists here but
          # not there would ship without a checksum; one that exists
          # there but not here would be blocked at release time. Keep
          # the two lists identical.
          shopt -s nullglob
          installers=(
            "$STAGE"/*.tar.gz
            "$STAGE"/*.zip
            "$STAGE"/*.AppImage
            "$STAGE"/*.deb
            "$STAGE"/*.dmg
            "$STAGE"/*.exe
            "$STAGE"/*.msi
          )
          if [ "${#installers[@]}" -eq 0 ]; then
            echo "::error::No GUI installer found in $STAGE to checksum"
            exit 1
          fi
          for installer in "${installers[@]}"; do
            [ -f "$installer" ] || continue
            # The sidecar must name the file the way a user will see it
            # in the release: the bare filename, e.g.
            # "phenotype-fabric-gui-windows-x64.msi".
            #
            # `sha256sum` escapes a filename that contains a backslash by
            # prefixing the WHOLE OUTPUT LINE with "\". On the Windows
            # runner, $STAGE is "${RUNNER_TEMP}/gui-artifacts" =
            # "D:\a\_temp\gui-artifacts", so the absolute path contains
            # backslashes and the sidecar came out as:
            #
            #     \a9179aaa7a819946b0388a65148d79bb6c...  phenotype-fabric-gui-windows-x64.exe
            #
            # The leading backslash lands on the DIGEST field, so every
            # comparison against it failed -- the release was refused for
            # two Windows installers whose bytes were perfectly fine. The
            # v0.1.7 republish run 40243421768 died exactly there, after
            # the Docker manifest push and the required-asset gate had
            # both succeeded.
            #
            # Computing the digest from INSIDE the directory with a
            # relative name produces a sidecar with no backslash at all:
            #
            #     a9179aaa7a819946b0388a65148d79bb6c...  phenotype-fabric-gui-windows-x64.exe
            #
            # which is what `sha256sum -c` expects.
            (
              cd "$STAGE"
              base="$(basename "$installer")"
              sha256sum "$base" > "${base}.sha256"
              cat "${base}.sha256"
            )
          done
          # CLI names its single sidecar `checksum`; the GUI job has
          # several, so point at the directory that holds them.
          echo "checksum_dir=$STAGE" >> "$GITHUB_ENV"

      # ── Upload GUI artifact ───────────────────────────────────────────
      - name: Upload GUI artifact
        uses: actions/upload-artifact@v7
        with:
          name: gui-${{ matrix.platform }}
          # The `*` glob picks up the <installer>.sha256 sidecars
          # generated above alongside the installers themselves, which
          # is the same pairing the CLI job makes explicit. Both are
          # needed: the installer is the artifact, the checksum is how
          # a user proves the download is intact.
          path: ${{ env.gui_artifacts_dir }}/*
          if-no-files-found: error
          retention-days: 3

  # ── cargo-deny gate (must pass before publish-crates or docker) ────
  deny:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check advisories, licenses, bans, sources
        # Run all four cargo-deny checks that the deny.toml file is
        # configured for. The previous invocation ran only `advisories`,
        # which left the other three sections of deny.toml unexercised
        # in CI.
        run: cargo deny check

  # ── Build identity (stable SHA over Cargo.lock, matrix-free) ──────
  identity:
    name: Build identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A dispatch must state its intent explicitly.
      #
      # The `confirm` input used to be declared and never read: a dispatch
      # with `confirm=publish`, `confirm=no`, or an empty string all ran
      # identically, so the input only decorated the UI while its own
      # description claimed an approval step that did not exist (the
      # `production` environment has no protection rules). This job is a
      # dependency of every publishing job (`docker`, `github-release`), so
      # failing here means nothing gets published.
      - name: Require explicit publish confirmation
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "publish" ]; then
            echo "::error::workflow_dispatch requires confirm=publish, got '${CONFIRM}'. Refusing to publish."
            exit 1
          fi
          echo "Publish confirmed."

      - uses: actions/checkout@v7

      - name: Compute build identity
        id: identity
        run: |
          IDENTITY=$(sha256sum Cargo.lock | cut -d' ' -f1 | cut -c1-12)
          echo "identity=${IDENTITY}" >> "$GITHUB_OUTPUT"
          echo "Build identity: ${IDENTITY}"
    outputs:
      identity: ${{ steps.identity.outputs.identity }}

  # ── Build Docker image once (matrix-free), natively ─────────────────
  # This job is the NATIVE amd64 gate: it builds the image on an amd64
  # runner and asserts that both binaries load and run inside it, so a
  # tag can only be cut on a commit whose Docker image is already proven
  # to work.
  #
  # It no longer saves the image as a tar artifact. The multi-arch
  # publish in the `docker` job builds its own image from the same
  # Dockerfile, so the tar had no consumer; keeping it only left a
  # large, unused artifact in every run -- and a `docker-image` artifact
  # had already leaked into a published release once.
  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [deny, identity]
    # This job was previously `continue-on-error: true` because the
    # Dockerfile carried a hand-maintained list of cargo dependency stubs.
    # That list drifted out of sync with the workspace and the v0.1.4
    # release's Docker build failed with 7 distinct missing-target errors
    # (for example `can't find lib 'fabric_cli'` and `can't find bin
    # 'tf-web'`). The stub layer has since been REMOVED from the
    # Dockerfile: it copies the real sources and builds only the two
    # binaries the runtime stage consumes, so there is no list to drift.
    #
    # The `docker-build` job in ci.yml now builds the image and asserts
    # that both binaries load and run on every push, so a tag can only be
    # cut on a commit whose Docker image is already proven to work. That
    # makes this job a genuine gate rather than a best-effort side effect:
    # a red Docker build is a real defect, not an expected outcome.
    #
    # This job exposes no outputs. It used to publish an `identity`
    # output, but that output was the RAW lockfile hash while the tag
    # built from it was the `build-<hash>` string, so any consumer that
    # read `outputs.identity` and re-applied the `build-` prefix
    # produced `build-build-<hash>`. Nothing reads it now: the publish
    # job and the verifier both build the tag from
    # `needs.identity.outputs.identity` directly, so there is exactly
    # one expression for the tag in the whole workflow.
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          source scripts/release/resolve_version.sh
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "docker_tag=${RELEASE_DOCKER_TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify lockfile matches build identity
        run: |
          ACTUAL=$(sha256sum Cargo.lock | cut -d' ' -f1 | cut -c1-12)
          EXPECTED="${{ needs.identity.outputs.identity }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Lockfile SHA mismatch: actual=$ACTUAL expected=$EXPECTED"
            exit 1
          fi
          echo "Lockfile SHA matches build identity: $ACTUAL"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag for build identity
        id: tags
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          echo "primary=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build image (load to local, do not push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.primary }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the built image's binaries load and run
        # A built image is not a working image. A binary that is present
        # but cannot load -- for example because a shared library such as
        # libssl.so.3 is missing from the runtime stage -- would be
        # published to the registry as a broken image. Run both binaries
        # inside the image before this job passes, so the published
        # bytes are proven to work.
        run: |
          set -uo pipefail
          failed=0
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.primary }}"
          # Both binaries are clap apps with the built-in `version` flag, so
          # `--version` prints a version string and exits 0. Running them
          # also proves every shared library the binary needs is present in
          # the runtime stage.
          check_binary() {
            bin="$1"; shift
            out="$(docker run --rm --entrypoint "/usr/local/bin/${bin}" "$IMAGE" "$@" 2>&1)"
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::${bin} $* failed inside the image (exit ${rc})"
              echo "${out}" | sed 's/^/    /'
              failed=1
              return
            fi
            if grep -qiE 'error while loading shared libraries|not found' <<<"$out"; then
              echo "::error::${bin} could not load a required shared library inside the image"
              echo "${out}" | sed 's/^/    /'
              failed=1
              return
            fi
            echo "OK ${bin} $* runs inside the image: ${out}"
          }
          check_binary fabric --version
          check_binary fabric-daemon --version
          if [ "$failed" = "1" ]; then
            echo "::error::One or more Docker image binaries do not run inside the image."
            exit 1
          fi

      # The image must WORK, not just contain runnable binaries.
      #
      # The `--version` checks above override the entrypoint, so they
      # cannot detect an image whose default command fails to start.
      # The v0.1.5 image proved the gap is real: it built, both binaries
      # ran, the release published successfully -- and a plain
      # `docker run <image>` still died immediately with
      #
      #   ERROR fabric_daemon: failed to create coordinator: database
      #   error: unable to open database file: state.db
      #
      # because the daemon opens a RELATIVE database path and the image
      # had no WORKDIR, so it resolved against `/`, which the
      # unprivileged `fabric` user cannot write.
      #
      # A second defect sat in the same image: the daemon binds
      # 127.0.0.1 by default, so `docker run -p 9400:9400` published a
      # port nothing listened on, and a CLI in a second container failed
      # with "status check failed ... Broken pipe".
      #
      # Publishing an image that cannot start is exactly the failure
      # mode this release workflow exists to prevent, so both are
      # asserted here, on the exact bytes that get pushed.
      # The three container assertions live in ONE script, so the release
      # workflow and CI cannot drift apart and so the exact artifact that
      # was validated locally is the artifact that gates the publish.
      #
      # The script was validated negatively as well as positively: it
      # FAILS at assertion 1 against the published v0.1.5 image (the
      # container exits with "unable to open database file: state.db")
      # and passes all three against the rebuilt image.
      #
      # This runs against the image built in THIS job -- the exact bytes
      # that get pushed -- so a broken image cannot be published.
      - name: Verify the built image starts and serves as a daemon
        run: |
          set -uo pipefail
          # The image reference must be spelled out here: the `IMAGE`
          # variable was set inside a DIFFERENT step's shell, and a shell
          # variable does not survive into a later step.
          scripts/acceptance/docker_acceptance.sh \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.primary }}"

  # ── Create GitHub Release ───────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `docker-build` is a hard gate here, not just for the `docker` push job.
    #
    # The v0.1.4 release proved the gap was real: `Build Docker image`
    # FAILED, `Create GitHub Release` SUCCEEDED, the release body told
    # users "The Docker image is also tagged with this identity as
    # build-<sha>", and the ghcr package was never created (the API
    # returns 404 for it). The release looked complete to a user and the
    # image did not exist.
    #
    # The release body makes a claim about the Docker image, so a release
    # must not be created unless that image was actually built and
    # verified. The `docker` push job stays best-effort (the registry
    # token may be absent) but it now runs BEFORE this job, so its
    # `pushed` output can tell the release body whether the image
    # actually reached the registry.
    needs: [build, build-gui, identity, docker-build, docker]
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          source scripts/release/resolve_version.sh
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "docker_tag=${RELEASE_DOCKER_TAG}" >> "$GITHUB_OUTPUT"

      - name: Download CLI + GUI archive artifacts (exclude docker-image)
        # The previous run's docker-image artifact (a stale .dockerbuild tarball
        # from a pre-bench-fix docker-build run) was being bundled into every
        # release because of `pattern: "*"` + `merge-multiple: true`. Filter to
        # the artifacts we actually want so a leaked docker-image never
        # pollutes the release.
        #
        # The `docker-build` job no longer produces that artifact at all
        # (the multi-arch publish builds its own image, so the amd64 tar
        # had no consumer). The filter is kept as defence in depth: the
        # pattern is the thing that stops a future artifact from leaking
        # into the release, and removing the filter because the known
        # offender is gone would remove the guard for the next one.
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          # `pattern` is a SINGLE minimatch pattern, NOT a list and NOT
          # newline-separated. download-artifact v8 does
          # `new Minimatch(inputs.pattern)` and filters on it (see
          # actions/download-artifact v8 src/download-artifact.ts). A YAML
          # block scalar here yields the literal two-line string
          # "cli-*\ngui-*", which matches nothing: the run on 2026-10-21
          # reported "Found 9 artifact(s)" then "Total of 0 artifact(s)
          # downloaded", and the release was published with ZERO assets
          # while the job still exited 0.
          #
          # Minimatch supports brace expansion, so `{cli-*,gui-*}` is the
          # correct way to express "these two prefixes" in ONE pattern.
          # Verified against the real v0.1.3 artifact names: it matches
          # exactly the 8 cli-*/gui-* artifacts and excludes the
          # `KooshaPari~PhenoFabric~<id>.dockerbuild` artifact.
          #
          # Do NOT narrow this to `cli-*`: that would silently drop every
          # GUI installer (dmg/deb/AppImage/msi/exe) from the release.
          pattern: '{cli-*,gui-*}'
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      # A combined SHA256SUMS manifest, so a user can verify EVERY
      # download with one command (`sha256sum -c SHA256SUMS`) instead of
      # hunting for per-file checksum assets. The per-archive
      # `<archive>.sha256` files are published too; this is the
      # convenience aggregate.
      - name: Generate combined SHA256SUMS manifest
        shell: bash
        run: |
          cd artifacts
          # Only real archives and installers get a checksum -- not the
          # per-file .sha256 files themselves, and not this manifest.
          # That falls out of the extension list: every pattern below
          # requires a terminal archive/installer extension, and
          # `<name>.dmg.sha256` / `SHA256SUMS` end in `.sha256` /
          # `SHA256SUMS`, neither of which any `-name` glob matches. Do
          # NOT "simplify" this by switching to a blanket
          # `-name 'phenotype-fabric-*'`, which would checksum the
          # sidecars into the manifest and then make each sidecar
          # describe a file that no longer matches what it was computed
          # from.
          #
          # This extension list is the definition of "a downloadable
          # artifact" for the whole release. The build-gui job's
          # sidecar step and the verification step below both repeat it;
          # all three must stay in sync or an installer type ships
          # unverifiable or the release blocks on a file it never made.
          find . -maxdepth 1 -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.AppImage' \
               -o -name '*.deb' -o -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) \
            -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
          if [ ! -s SHA256SUMS ]; then
            echo "::error::SHA256SUMS is empty; no archives were found to checksum"
            exit 1
          fi

      # A release with zero (or partial) assets is worse than a failed
      # release: `softprops/action-gh-release` does NOT fail when `files:
      # artifacts/*` matches nothing, so the run on 2026-10-21 published
      # v0.1.3 with 0 assets and still exited 0. Fail loudly here instead,
      # before the release exists, so a partial publish is impossible.
      - name: Assert required release assets are present
        shell: bash
        env:
          # The RESOLVED tag, not `github.ref_name`. On a
          # workflow_dispatch run `github.ref_name` is the branch name
          # ("main"), so this gate looked for
          # "phenotype-fabric-main-linux-x86_64.tar.gz" while the build
          # jobs had produced
          # "phenotype-fabric-v0.1.7-linux-x86_64.tar.gz". Every asset
          # was reported missing and the release was refused -- even
          # though the artifacts were correct.
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          missing=0
          for required in \
            "phenotype-fabric-${RELEASE_TAG}-linux-x86_64.tar.gz" \
            "phenotype-fabric-${RELEASE_TAG}-linux-aarch64.tar.gz" \
            "phenotype-fabric-${RELEASE_TAG}-macos-x86_64.tar.gz" \
            "phenotype-fabric-${RELEASE_TAG}-macos-aarch64.tar.gz" \
            "phenotype-fabric-${RELEASE_TAG}-windows-x86_64.zip" \
            "phenotype-fabric-gui-macos-arm64.dmg" \
            "phenotype-fabric-gui-macos-x64.dmg" \
            "phenotype-fabric-gui-linux-x64.deb" \
            "phenotype-fabric-gui-linux-x64.AppImage" \
            "phenotype-fabric-gui-windows-x64.msi" \
            "phenotype-fabric-gui-windows-x64.exe" \
          ; do
            if [ ! -f "artifacts/${required}" ]; then
              echo "::error::Required release asset missing from artifacts/: ${required}"
              missing=1
            else
              echo "OK ${required}"
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::Refusing to publish a release with missing assets."
            echo "::error::Files actually downloaded:"
            find artifacts -type f | sort || true
            exit 1
          fi
          echo "All required release assets present."

      # Every published archive must have a checksum, and a checksum
      # that actually matches the archive it describes. A checksum file
      # that does not match is worse than no checksum at all, because a
      # user who verifies against it would be told their download is
      # corrupt when it is fine.
      - name: Verify every archive has a matching checksum
        shell: bash
        env:
          # The RESOLVED tag, not `github.ref_name` -- same reason as the
          # required-asset gate above. On a dispatch, `github.ref_name` is
          # the branch ("main"), so this gate checked sidecars named for
          # artifacts that do not exist.
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          cd artifacts
          failed=0

          # 1. The combined manifest must exist and be non-empty.
          if [ ! -s SHA256SUMS ]; then
            echo "::error::SHA256SUMS is missing or empty"
            exit 1
          fi

          # 2. Every archive and installer in the manifest must have a
          #    per-file .sha256 sidecar.
          #
          #    A manifest line is only usable if it has BOTH fields: a
          #    64-hex digest and a filename. A line with only one field
          #    is a truncated or malformed manifest, and skipping it
          #    silently would let a corrupt manifest pass. The old
          #    `[ -n "$name" ] || continue` guard treated such a line as
          #    blank and dropped it, so `SHA256SUMS` with a truncated
          #    line passed the gate AND the success message counted the
          #    malformed line as an archive. Both are now errors.
          #
          #    The digest format is checked here too, so a manifest
          #    carrying a non-hex digest is rejected at the source
          #    rather than being compared as a string that happens to
          #    differ from the real one.
          manifest_count=0
          while read -r sum name || [ -n "${sum}${name}" ]; do
            # A blank line is harmless. A line with a digest but NO
            # filename is a truncated or malformed manifest entry, and
            # it must not be skipped: the old `[ -n "$name" ] || continue`
            # guard dropped it, so `SHA256SUMS` with a truncated line
            # passed the gate AND the success message counted the
            # malformed line as an archive. Both are now errors.
            if [ -z "$sum" ]; then
              continue
            fi
            if [ -z "$name" ]; then
              echo "::error::Malformed SHA256SUMS line (no filename): $sum"
              failed=1
              continue
            fi
            # The digest format is checked here too, so a manifest
            # carrying a non-hex digest is rejected at the source
            # rather than being compared as a string that happens to
            # differ from the real one.
            if ! printf '%s' "$sum" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error::Malformed SHA256SUMS line (bad digest): $sum"
              failed=1
              continue
            fi
            manifest_count=$((manifest_count + 1))
            if [ ! -f "${name}.sha256" ]; then
              echo "::error::Missing per-file checksum: ${name}.sha256"
              failed=1
            fi
          done < SHA256SUMS

          # 2b. The manifest must not list the same artifact twice.
          #     Duplicate lines are not an integrity bypass -- every line
          #     is still byte-verified by check 3 -- but they inflate the
          #     artifact count in the success message and make the
          #     manifest ambiguous for a user reading it.
          duplicate_count="$(awk '{print $2}' SHA256SUMS | grep -v '^$' | sort | uniq -d | wc -l | tr -d ' ')"
          if [ "$duplicate_count" != "0" ]; then
            echo "::error::SHA256SUMS lists $duplicate_count artifact(s) more than once:"
            awk '{print $2}' SHA256SUMS | grep -v '^$' | sort | uniq -d | while IFS= read -r dup; do
              echo "::error::  $dup"
            done
            failed=1
          fi

          # 3. Each sidecar must match the file it describes -- and so
          #    must the manifest. Checking only the manifest leaves a
          #    sidecar free to carry a stale digest: a user running
          #    `sha256sum -c foo.deb.sha256` would be told their download
          #    is corrupt when it is fine. Both have to agree with the
          #    real bytes.
          while read -r sum name || [ -n "${sum}${name}" ]; do
            if [ -z "$sum" ]; then
              continue
            fi
            if [ -z "$name" ]; then
              # Malformed line; check 2 already reported it.
              continue
            fi
            if [ ! -f "$name" ]; then
              echo "::error::SHA256SUMS references a missing file: $name"
              failed=1
              continue
            fi
            actual="$(sha256sum "$name" | cut -d' ' -f1)"
            if [ "$actual" != "$sum" ]; then
              echo "::error::Checksum mismatch for $name"
              echo "::error::  expected: $sum"
              echo "::error::  actual:   $actual"
              failed=1
            fi
            # Only compare when the sidecar is actually there: check 2
            # already reports a missing one, and redirecting `cut` at a
            # file that does not exist makes bash itself print a
            # "No such file or directory" line that buries the real
            # error in noise.
            if [ -f "${name}.sha256" ]; then
              sidecar_sum="$(cut -d' ' -f1 < "${name}.sha256")"
              if [ "$sidecar_sum" != "$actual" ]; then
                echo "::error::Per-file checksum mismatch for ${name}.sha256"
                echo "::error::  actual bytes: $actual"
                echo "::error::  sidecar says: $sidecar_sum"
                failed=1
              fi
            fi
          done < SHA256SUMS

          # 4. Reverse coverage: every downloadable artifact sitting in
          #    artifacts/ must appear in the manifest. Checks 2 and 3
          #    only walk the manifest, so an artifact that was never
          #    checksummed at all -- a new installer type added to a
          #    collect step but not to the find expression above -- was
          #    completely invisible to them and would ship with no
          #    published checksum and no complaint.
          #
          #    The find expression MUST stay identical to the one in
          #    "Generate combined SHA256SUMS manifest" above. Both use
          #    `find .`, so both produce `./<name>` and compare cleanly.
          #
          #    Manifest names are the second whitespace-delimited field
          #    of each line (sha256sum emits `<sum>  <name>`). Comparing
          #    whole lines with a substring grep would let `foo.deb`
          #    vouch for `foo.deb.signed`, so extract field 2 first.
          manifest_names="$(awk '{print $2}' SHA256SUMS)"
          while IFS= read -r -d '' artifact; do
            if ! printf '%s\n' "$manifest_names" | grep -qxF -- "$artifact"; then
              echo "::error::Artifact present in artifacts/ but not covered by SHA256SUMS: $artifact"
              failed=1
            fi
          done < <(find . -maxdepth 1 -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.AppImage' \
               -o -name '*.deb' -o -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) \
            -print0 | sort -z)

          # 5. Reverse coverage for SIDECARS. The loop above enumerates
          #    only the seven archive/installer extensions, so a `.sha256`
          #    file is never in its find set; and checks 2 and 3 iterate
          #    the MANIFEST, which a sidecar never appears in. A sidecar
          #    describing a file that does not exist was therefore
          #    invisible to every check and the gate exited 0.
          #
          #    That is not a cosmetic hole. The post-publish download
          #    glob is `phenotype-fabric-*.sha256`, so a stale sidecar
          #    for a removed installer (say a Windows .msi that is no
          #    longer built) gets published to the release page, and a
          #    user who runs `sha256sum -c` on it is pointed at a file
          #    that is not there.
          #
          #    Every sidecar must therefore have a subject: strip the
          #    `.sha256` suffix and require the remaining file to exist.
          while IFS= read -r -d '' sidecar; do
            subject="${sidecar%.sha256}"
            if [ ! -f "$subject" ]; then
              echo "::error::Checksum sidecar has no matching file: $sidecar (expected $subject)"
              failed=1
            fi
          done < <(find . -maxdepth 1 -type f -name '*.sha256' -print0 | sort -z)

          if [ "$failed" = "1" ]; then
            echo "::error::One or more checksum files are missing or do not match."
            exit 1
          fi
          echo "All $manifest_count published archives have a matching SHA-256 checksum."

      - name: Create release body
        id: body
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # The Docker claim in the body must reflect reality. The `docker`
          # job ran before this one and reported whether the image actually
          # reached the registry; v0.1.4 shipped a body that promised an
          # image which was never published (ghcr returns 404 for it).
          # Only claim the image when it is really there.
          if [ "${{ needs.docker.outputs.pushed }}" = "true" ]; then
            DOCKER_LINE="The Docker image is published as a multi-architecture manifest list for \`linux/amd64\` and \`linux/arm64\`, and is also tagged with this identity as \`build-${{ needs.identity.outputs.identity }}\` for cross-reference. The \`linux/amd64\` image was built and exercised natively; the \`linux/arm64\` image was built under QEMU emulation on an x86_64 runner, so it carries emulated rather than native arm64 evidence."
          else
            DOCKER_LINE="The Docker image for this release was built and verified, but was not published to the container registry."
          fi
          cat > release_body.md << 'BODY_EOF'
          ## CLI Binaries

          | Platform | Archive |
          |----------|---------|
          | Linux x86_64 | `phenotype-fabric-TAG-linux-x86_64.tar.gz` |
          | Linux ARM64 | `phenotype-fabric-TAG-linux-aarch64.tar.gz` |
          | macOS x64 | `phenotype-fabric-TAG-macos-x86_64.tar.gz` |
          | macOS ARM64 | `phenotype-fabric-TAG-macos-aarch64.tar.gz` |
          | Windows x64 | `phenotype-fabric-TAG-windows-x86_64.zip` |

          > Every archive above was built and exercised on a runner
          > that natively hosts its target platform. Linux ARM64 is
          > built on an `ubuntu-24.04-arm` runner; the Docker arm64
          > image is the one exception, and it is built under QEMU
          > emulation and labelled as such below.

          ## Desktop GUI

          | Platform | Installer |
          |----------|-----------|
          | macOS ARM64 | `phenotype-fabric-gui-macos-arm64.dmg` |
          | macOS x64 | `phenotype-fabric-gui-macos-x64.dmg` |
          | Linux x64 | `phenotype-fabric-gui-linux-x64.deb` |
          | Linux x64 | `phenotype-fabric-gui-linux-x64.AppImage` |
          | Windows x64 | `phenotype-fabric-gui-windows-x64.msi` |
          | Windows x64 | `phenotype-fabric-gui-windows-x64.exe` |

          ## Build Identity

          This release was built from a commit with the following Cargo.lock SHA-256 prefix (first 12 chars):

          `BUILD_IDENTITY_PLACEHOLDER`

          DOCKER_IMAGE_LINE_PLACEHOLDER
          BODY_EOF
          sed -i "s/TAG/${TAG}/g" release_body.md
          sed -i "s/BUILD_IDENTITY_PLACEHOLDER/${{ needs.identity.outputs.identity }}/g" release_body.md
          # Substitute the Docker line last: it contains the identity too,
          # and `sed -i` on the placeholder above must not have already
          # rewritten it.
          awk -v line="$DOCKER_LINE" '{ if ($0 == "DOCKER_IMAGE_LINE_PLACEHOLDER") print line; else print }' release_body.md > release_body.md.tmp
          mv release_body.md.tmp release_body.md
          cat release_body.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          # The release MUST be bound to the resolved tag explicitly.
          # Without `tag_name`, this action falls back to GITHUB_REF, which
          # on a workflow_dispatch run is `refs/heads/main` -- so the
          # release would be created against the branch instead of the
          # version it publishes. `tag_name` also makes the action CREATE
          # the tag if it does not exist; here the tag always exists (the
          # resolver refuses a version whose tag is absent from origin), so
          # the release attaches to the existing, already-pushed tag.
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          body_path: release_body.md
          files: artifacts/*

  # ── Publish library crates to crates.io ─────────────────────────────
  publish-crates:
    name: Publish crates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deny, identity]
    environment: production
    # CRATES_IO_TOKEN is not configured on this repo, so this job
    # skips cleanly with a 'wire a secret' notice instead of running
    # `cargo publish` (which would fail with a cryptic empty-token
    # error). The operator can wire the secret at any time:
    #   https://github.com/KooshaPari/PhenoFabric/settings/secrets/actions
    # Once CRATES_IO_TOKEN is present, the publish steps below will
    # run automatically. Until then, this job is a no-op and exits 0.
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Skip if CRATES_IO_TOKEN is missing
        id: token-check
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CRATES_IO_TOKEN secret is not configured on this repo. Skipping cargo publish."
            echo "::warning::To enable crate publishing, wire the secret at:"
            echo "::warning::  https://github.com/KooshaPari/PhenoFabric/settings/secrets/actions"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "CRATES_IO_TOKEN is present; proceeding with cargo publish"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record build identity
        if: steps.token-check.outputs.skip != 'true'
        env:
          BUILD_IDENTITY: ${{ needs.identity.outputs.identity }}
        run: |
          echo "Publishing crates for build identity: ${BUILD_IDENTITY}"
          # Note: BUILD_IDENTITY is already exported by the env: block
          # above; do NOT echo it into GITHUB_ENV — GITHUB_ENV requires
          # strict KEY=VALUE format and rejects lines like
          # "Build identity: abc123".

      - name: Verify lockfile matches build identity
        if: steps.token-check.outputs.skip != 'true'
        run: |
          ACTUAL=$(sha256sum Cargo.lock | cut -d' ' -f1 | cut -c1-12)
          EXPECTED="${{ needs.identity.outputs.identity }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Lockfile SHA mismatch: actual=$ACTUAL expected=$EXPECTED"
            exit 1
          fi
          echo "Lockfile SHA matches build identity: $ACTUAL"

      # Publish order must respect the workspace dependency graph.
      # fabric-capability is a leaf (no internal deps), so publish it first.
      # Then the other leaves (phenotype-manifest, fabric-terminal, fabric-capture,
      # fabric-research-ledger), then fabric-graph (depends on fabric-capability),
      # then the consumers in topological order.
      # This avoids "no matching package found" errors when cargo validates
      # the path-dep version requirements at publish time.
      #
      # Crates that are publishable per `cargo metadata` but are NOT included
      # here (because they depend on the not-yet-publishable fabric-frame-transport
      # which has `publish = false`):
      #   - fabric-daemon         (deps: fabric-graph, fabric-capability, fabric-frame-transport, fabric-persist)
      #   - fabric-surface-mojo   (deps: fabric-graph, fabric-capability, fabric-frame-transport)
      #   - fabric-orchestrator   (deps: many, including fabric-frame-transport and fabric-checker)
      # To enable those, either flip fabric-frame-transport to publish = true,
      # or add `version = "0.1.0"` to its path-deps in those three Cargo.toml
      # files (cargo will fail publish-validation otherwise because the path
      # will be stripped at publish time).
      - name: Publish fabric-capability
        if: steps.token-check.outputs.skip != 'true'
        run: cargo publish -p fabric-capability --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish phenotype-manifest
        if: steps.token-check.outputs.skip != 'true'
        run: cargo publish -p phenotype-manifest --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish fabric-terminal
        if: steps.token-check.outputs.skip != 'true'
        run: cargo publish -p fabric-terminal --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish fabric-capture
        if: steps.token-check.outputs.skip != 'true'
        run: cargo publish -p fabric-capture --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish fabric-research-ledger
        if: steps.token-check.outputs.skip != 'true'
        run: cargo publish -p fabric-research-ledger --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish fabric-graph
        if: steps.token-check.outputs.skip != 'true'
        run: cargo publish -p fabric-graph --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish fabric-checker
        if: steps.token-check.outputs.skip != 'true'
        run: cargo publish -p fabric-checker --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish fabric-capability-ffi
        if: steps.token-check.outputs.skip != 'true'
        run: cargo publish -p fabric-capability-ffi --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish phenotype-nvms-adapter
        if: steps.token-check.outputs.skip != 'true'
        run: cargo publish -p phenotype-nvms-adapter --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish fabric-graph-cli
        if: steps.token-check.outputs.skip != 'true'
        run: cargo publish -p fabric-graph-cli --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish fabric-workspace
        if: steps.token-check.outputs.skip != 'true'
        run: cargo publish -p fabric-workspace --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish fabric-persist
        if: steps.token-check.outputs.skip != 'true'
        run: cargo publish -p fabric-persist --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  # ── Docker image (multi-arch publish; native gate in docker-build) ──
  docker:
    name: Push Docker image
    runs-on: ubuntu-latest
    # A Rust workspace build under QEMU emulation is SLOW -- the arm64
    # half of the multi-arch build runs every compile step through
    # binfmt translation. The previous 15-minute budget was sized for
    # a `docker load` + `docker push` of an already-built image and is
    # nowhere near enough to build the workspace twice. Under the old
    # budget the arm64 build would be killed mid-compile and the job
    # would fail for a reason that has nothing to do with the image.
    timeout-minutes: 90
    # `identity` is a DIRECT dependency, not just reachable through
    # `docker-build`. The cross-reference tag `build-<hash>` is built
    # from `needs.identity.outputs.identity`, and GitHub only exposes
    # the outputs of a job listed in `needs`. The `docker-build` job
    # used to re-export that value as its own `identity` output, but
    # that output was the RAW hash while the tag built from it was the
    # `build-<hash>` string, so reading `outputs.identity` and
    # re-applying the prefix produced `build-build-<hash>`. Depending
    # on `identity` directly removes the extra hop and gives the
    # workflow exactly ONE expression for the tag.
    needs: [docker-build, identity]
    environment: production
    # The upstream `docker-build` job is now a hard gate: it builds the
    # image and asserts that both binaries load and run inside it, so a
    # failure there is a genuine defect and must not be published.
    #
    # This job therefore DEPENDS on `docker-build` rather than running
    # beside it, and that ordering is deliberate even though it means
    # the amd64 half of the workspace is compiled twice per release
    # (once natively by `docker-build`, once inside this multi-arch
    # build). If the two jobs ran in parallel, a broken amd64 image
    # could still be pushed to the registry before `docker-build`
    # reported the defect, leaving a broken image published under the
    # release tag for anyone who pulls it directly. Not publishing a
    # known-bad image is worth one extra compile.
    #
    # This job stays best-effort for a different reason: pushing to the
    # GitHub Container Registry needs a token that may be absent from a
    # fork or a personal repository, and a missing credential must not
    # fail a release whose binaries and assets are already correct.
    #
    # The best-effort behaviour is implemented PER STEP rather than with a
    # job-level `continue-on-error`, on purpose. A job-level
    # `continue-on-error` makes the job conclude "success" while its
    # outcome is "failure", which leaves the downstream `pushed` output
    # dependent on output-propagation semantics that are easy to get
    # wrong. Instead each fallible step is individually
    # `continue-on-error`, the job itself always succeeds, and the final
    # step unconditionally records whether the image really reached the
    # registry. The `pushed` output is therefore always definitive, which
    # is what the release body depends on to make a truthful claim.
    outputs:
      # Whether the image actually reached the registry. The release body
      # makes a claim about the Docker image, and that claim must not be
      # made when the push failed. `pushed` is the single source of truth
      # for that claim.
      pushed: ${{ steps.pushresult.outputs.pushed }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          source scripts/release/resolve_version.sh
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "docker_tag=${RELEASE_DOCKER_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (linux/arm64 emulation)
        # The arm64 half of the manifest list is built under QEMU
        # emulation on this amd64 runner. That makes the arm64 image
        # EMULATED evidence, not native. The release body says so
        # explicitly. The linux/amd64 image is genuinely native: the
        # `docker-build` job built it on an amd64 runner and verified
        # the binaries run there.
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        id: login
        # A missing or rejected token is an expected credential issue, not
        # an image defect. The image was already built and verified by
        # `docker-build`.
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch manifest list
        id: push
        # A missing or rejected token is an expected credential issue on
        # forks, not an image defect. The image was already built and
        # verified by `docker-build`. The `pushed` output below is the
        # single source of truth for whether the release body may claim
        # the image exists.
        #
        # This step REPLACES the old load-tar / retag / `docker push
        # --all-tags` chain, which could only ever publish a
        # single-architecture image: the tar built by `docker-build` is
        # an amd64 image, and `docker push` of a local image writes an
        # image manifest, not a manifest list. A multi-arch tag has to
        # be produced by a builder that understands platforms.
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # `load` and `push` are mutually exclusive in buildx: `load`
          # writes a single-architecture image tar into the local
          # daemon, which cannot represent a manifest list.
          load: false
          # Attestation manifests carry the platform `unknown/unknown`.
          # Left enabled they appear in the manifest list and can be
          # mistaken for a real image entry.
          provenance: false
          sbom: false
          # ── Tag set ─────────────────────────────────────────────────
          # `build-<identity>` is the CROSS-REFERENCE tag: it names the
          # exact lockfile this image was built from, so a user can
          # tie a running container back to a source tree.
          #
          # The `-amd64` / `-arm64` tags are deliberately NOT published
          # from this multi-arch build. A single `build-push-action`
          # invocation with `platforms: linux/amd64,linux/arm64` pushes
          # the SAME manifest list to every tag it is given. Tagging
          # that list `:v1.2.3-amd64` would publish a manifest list
          # that contains BOTH architectures under a name that claims
          # to be amd64-only. A user pulling that tag on an arm64 host
          # would silently get the arm64 image, and a user pulling it on
          # amd64 would get a manifest that does not match its name.
          # The name has to describe the contents or it is a lie.
          #
          # Per-architecture tags, if they are ever wanted, must be
          # produced by a separate single-platform push.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.docker_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ needs.identity.outputs.identity }}
          cache-from: type=gha,scope=multiarch
          cache-to: type=gha,mode=max,scope=multiarch

      - name: Verify the published manifest contains both architectures
        # `always()` so it runs even when the push step failed. The
        # check is skipped -- explicitly and loudly -- when nothing was
        # pushed, because there is no manifest to read. When the push
        # DID succeed, a manifest missing an architecture is a real
        # defect and fails the job.
        if: always()
        run: |
          if [ "${{ steps.push.outcome }}" != "success" ]; then
            echo "::warning::Push did not reach the registry; no manifest to verify."
            exit 0
          fi
          scripts/acceptance/docker_manifest_archs.sh \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.docker_tag }}" \
            "linux/amd64 linux/arm64"

      - name: Record whether the image reached the registry
        id: pushresult
        # `always()` so this step still runs when an EARLIER step failed
        # (for example the registry login, when the token is absent).
        # Without it the `pushed` output would be empty and the release
        # body would have to guess.
        #
        # The success test is `steps.push.outcome`, which is the step's
        # result BEFORE `continue-on-error` is applied -- so it correctly
        # reports "failure" for a push that did not actually reach the
        # registry, while the job itself still concludes successfully.
        if: always()
        run: |
          if [ "${{ steps.push.outcome }}" = "success" ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "OK image pushed to the registry"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Image was built and verified but did NOT reach the registry (push outcome: ${{ steps.push.outcome }}, login outcome: ${{ steps.login.outcome }})"
          fi

  # ── Post-publish verification ────────────────────────────────────────
  verify:
    name: Post-publish verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Verify depends on github-release + identity + docker.
    #
    # `publish-crates` is best-effort (the crates.io token may be missing)
    # and the verify job's purpose is to confirm the GitHub release itself
    # is correct, which is independent of that side effect.
    #
    # `docker` is included so the job can read its `pushed` output. That
    # output lets the Docker pull below be FAIL-CLOSED: if the push
    # claimed the image reached the registry, a pull that fails means the
    # published image is broken and the release must not be reported as
    # good. When the push did not happen the check is skipped explicitly
    # rather than silently tolerated.
    needs: [github-release, identity, docker]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        # The output MUST be named `tag`: every step below in this job reads
        # it as `steps.version.outputs.tag`. It previously wrote
        # `version=...` instead, so `TAG` expanded to the empty string and
        # `gh release download ""` reported "no assets to download" -- the
        # whole post-publish verification was a no-op that could never have
        # caught a partial archive. (The `docker` job below uses the same
        # `version=` name and reads `.version` consistently, so it is
        # correct as written; only this job was mismatched.)
        #
        # The value now comes from the shared resolver rather than from
        # `${GITHUB_REF#refs/tags/}`, so this job verifies the release
        # under the SAME name every other job published it under. On a
        # dispatch, the old expression produced the literal string
        # "refs/heads/main", and `gh release download refs/heads/main`
        # would fail on a release that actually exists under its tag.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          source scripts/release/resolve_version.sh
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "docker_tag=${RELEASE_DOCKER_TAG}" >> "$GITHUB_OUTPUT"

      - name: Download GH release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          mkdir -p release-assets
          # Match the real asset-name format. Asset names are:
          #   CLI: phenotype-fabric-${TAG}-{platform}.{tar.gz|zip}
          #   GUI: phenotype-fabric-gui-{platform}.{AppImage|deb|dmg|exe|msi}
          #   sidecars: <any of the above>.sha256
          # The `phenotype-fabric-*.sha256` pattern is what brings the
          # per-file sidecars down for BOTH job families -- CLI sidecars
          # (phenotype-fabric-${TAG}-....tar.gz.sha256) and the GUI
          # sidecars added by the build-gui job
          # (phenotype-fabric-gui-....dmg.sha256), which share the
          # `phenotype-fabric-` prefix. Without it the check below would
          # be verifying the manifest against files it could not prove
          # were individually verifiable for a user.
          # SHA256SUMS itself does NOT match that glob (no
          # `phenotype-fabric-` prefix), which is why it needs its own
          # --pattern entry; the two do not overlap.
          # `gh release download` ORs multiple --pattern flags together
          # (verified empirically against v0.1.2 on 2026-10-21: a matching
          # .tar.gz pattern plus a non-matching .zip pattern still
          # downloaded the .tar.gz files and exited 0). The docker-image
          # artifact, if it ever leaks to the release, will NOT match any
          # of these (it has a .tar suffix, not .tar.gz, and no -gui-
          # segment).
          gh release download "$TAG" --dir release-assets \
            --pattern 'phenotype-fabric-*.tar.gz' \
            --pattern 'phenotype-fabric-*.zip' \
            --pattern 'phenotype-fabric-*.AppImage' \
            --pattern 'phenotype-fabric-*.deb' \
            --pattern 'phenotype-fabric-*.dmg' \
            --pattern 'phenotype-fabric-*.exe' \
            --pattern 'phenotype-fabric-*.msi' \
            --pattern 'phenotype-fabric-*.sha256' \
            --pattern 'SHA256SUMS'
          echo "::group::Downloaded assets"
          find release-assets -type f | sort
          echo "::endgroup::"

      # Verify the checksums against the artifacts as DOWNLOADED from the
      # release page. This is the end-to-end proof that a user can
      # actually verify what they downloaded: the manifest exists, it
      # covers the archives, and every digest matches the real bytes
      # that the registry served.
      #
      # No release before v0.1.7 published any checksum at all, so
      # nothing in this repo had ever proven that a downloaded archive
      # was intact.
      - name: Verify published checksums match the downloaded assets
        run: |
          cd release-assets
          failed=0

          if [ ! -s SHA256SUMS ]; then
            echo "::error::SHA256SUMS was not published to the release"
            exit 1
          fi

          # The manifest lists archives by bare filename, so verify from
          # the directory that holds them.
          #
          # A manifest line must have BOTH a 64-hex digest and a
          # filename. A single-field line is a truncated or malformed
          # manifest; the old `[ -n "$name" ] || continue` guard dropped
          # it silently, so a corrupt manifest passed this gate and the
          # success message counted the malformed line as an asset.
          # Malformed lines and duplicate listings are both errors now.
          manifest_count=0
          while read -r sum name || [ -n "${sum}${name}" ]; do
            if [ -z "$sum" ]; then
              continue
            fi
            if [ -z "$name" ]; then
              echo "::error::Malformed SHA256SUMS line (no filename): $sum"
              failed=1
              continue
            fi
            if ! printf '%s' "$sum" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error::Malformed SHA256SUMS line (bad digest): $sum"
              failed=1
              continue
            fi
            manifest_count=$((manifest_count + 1))
            if [ ! -f "$name" ]; then
              echo "::error::SHA256SUMS references a file not published: $name"
              failed=1
              continue
            fi
            actual="$(sha256sum "$name" | cut -d' ' -f1)"
            if [ "$actual" != "$sum" ]; then
              echo "::error::Checksum mismatch for $name"
              echo "::error::  expected: $sum"
              echo "::error::  actual:   $actual"
              failed=1
            else
              echo "OK $name"
            fi

            # The release job already proved each sidecar matches before
            # publishing; re-prove it against the bytes the release
            # actually served, because a sidecar that was correct in the
            # runner workspace can still be wrong on the release page.
            # A published sidecar a user cannot trust is worse than no
            # sidecar: it tells them their intact download is corrupt.
            if [ ! -f "${name}.sha256" ]; then
              echo "::error::Missing published per-file checksum: ${name}.sha256"
              failed=1
            else
              sidecar_sum="$(cut -d' ' -f1 < "${name}.sha256" 2>/dev/null || true)"
              if [ "$sidecar_sum" != "$actual" ]; then
                echo "::error::Per-file checksum mismatch for ${name}.sha256"
                echo "::error::  actual bytes: $actual"
                echo "::error::  sidecar says: ${sidecar_sum:-<empty or unreadable>}"
                failed=1
              else
                echo "OK ${name}.sha256"
              fi
            fi
          done < SHA256SUMS

          # Reverse coverage: every artifact actually served by the
          # release must be in the manifest. The loop above only walks
          # the manifest, so an artifact published WITHOUT a manifest
          # entry -- a GUI installer whose sidecar step was skipped --
          # would be invisible here and ship unverifiable. Same find
          # expression as the release job; `find .` keeps the `./`
          # prefix that SHA256SUMS entries carry.
          manifest_names="$(awk '{print $2}' SHA256SUMS)"
          while IFS= read -r -d '' artifact; do
            if ! printf '%s\n' "$manifest_names" | grep -qxF -- "$artifact"; then
              echo "::error::Published asset not covered by SHA256SUMS: $artifact"
              failed=1
            fi
          done < <(find . -maxdepth 1 -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.AppImage' \
               -o -name '*.deb' -o -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) \
            -print0 | sort -z)

          # Reverse coverage for SIDECARS, and a duplicate-listing
          # check. The loop above enumerates only the seven
          # archive/installer extensions, so a published `.sha256` is
          # never in its find set; and the manifest walk never sees a
          # sidecar either. A published sidecar whose subject was not
          # published was therefore invisible to every check here --
          # and it IS published, because the download glob above
          # matches `phenotype-fabric-*.sha256`.
          while IFS= read -r -d '' sidecar; do
            subject="${sidecar%.sha256}"
            if [ ! -f "$subject" ]; then
              echo "::error::Published checksum sidecar has no matching file: $sidecar (expected $subject)"
              failed=1
            fi
          done < <(find . -maxdepth 1 -type f -name '*.sha256' -print0 | sort -z)

          duplicate_count="$(awk '{print $2}' SHA256SUMS | grep -v '^$' | sort | uniq -d | wc -l | tr -d ' ')"
          if [ "$duplicate_count" != "0" ]; then
            echo "::error::SHA256SUMS lists $duplicate_count asset(s) more than once:"
            awk '{print $2}' SHA256SUMS | grep -v '^$' | sort | uniq -d | while IFS= read -r dup; do
              echo "::error::  $dup"
            done
            failed=1
          fi

          if [ "$failed" = "1" ]; then
            echo "::error::Published checksums do not match the published assets."
            exit 1
          fi
          echo "All $manifest_count published assets match their published SHA-256 checksums."

      - name: Verify all 5 CLI archives present
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          missing=0
          for platform in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64 windows-x86_64; do
            if [ "$platform" = "windows-x86_64" ]; then
              ext="zip"
            else
              ext="tar.gz"
            fi
            expected="phenotype-fabric-${TAG}-${platform}.${ext}"
            if [ ! -f "release-assets/${expected}" ]; then
              echo "::error::Missing CLI asset: ${expected}"
              missing=1
            else
              echo "OK ${expected}"
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::One or more CLI assets missing from GH release"
            exit 1
          fi

      # The step above only proves the ARCHIVES exist. It says nothing about
      # their CONTENTS -- which is exactly how v0.1.2 shipped four archives
      # that were missing the main `fabric` CLI binary (the build asked for
      # a bin named "fabric-cli" that does not exist, and `2>/dev/null ||
      # true` swallowed the miss). Verify the contents too, so a
      # wrong-bin-name release can never pass verification again.
      - name: Verify CLI archives contain the expected binaries
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # Must match EXPECTED_RELEASE_BINS in the build/package job.
          EXPECTED="fabric fabric-daemon fabric-tui fabric-tray fabric-graph-cli"
          failed=0
          #
          # Every published platform goes through the SAME loop. This
          # used to special-case Windows in a separate hand-written
          # block with a hardcoded archive name, which meant the
          # Windows archive's contents were checked by a code path
          # that no list could audit: adding a platform to the matrix
          # did not add it to the contents check, and nothing failed.
          #
          # One loop, one list, every platform. The archive extension is
          # derived from the platform the same way the existence check
          # derives it, so the two cannot disagree about what a
          # platform's archive is called.
          for platform in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64 windows-x86_64; do
            if [ "$platform" = "windows-x86_64" ]; then
              ext="zip"
            else
              ext="tar.gz"
            fi
            archive="release-assets/phenotype-fabric-${TAG}-${platform}.${ext}"
            # A missing archive is the EXISTENCE check's job, not this
            # one. Skip it here rather than failing twice for the same
            # underlying problem.
            [ -f "$archive" ] || continue
            if [ "$ext" = "zip" ]; then
              listing=$(unzip -l "$archive")
              # Windows binaries carry a .exe suffix.
              suffix=".exe"
            else
              listing=$(tar tzf "$archive")
              suffix=""
            fi
            for bin in $EXPECTED; do
              if ! printf '%s\n' "$listing" | grep -qE "/${bin}${suffix}$"; then
                echo "::error::${archive} does not contain expected binary '${bin}${suffix}'"
                failed=1
              fi
            done
            echo "---- ${archive} ----"
            printf '%s\n' "$listing"
          done
          if [ "$failed" = "1" ]; then
            echo "::error::One or more release archives are missing expected binaries; the release artifact is not usable."
            exit 1
          fi
          echo "All release archives contain the expected binaries: $EXPECTED"

      - name: Verify Docker image is pullable
        # The `docker` job reports whether the image actually reached the
        # registry, so this check can be fail-closed instead of
        # best-effort:
        #
        #   pushed=true  -> the image MUST be pullable, or the release is
        #                   reporting a broken image and must fail.
        #   pushed=false -> the image was never published (an expected
        #                   credential issue, not an image defect), so the
        #                   pull is skipped explicitly rather than
        #                   silently tolerated.
        #
        # v0.1.4 shipped a release that told users a Docker image existed
        # when the ghcr package returned 404. This check is the end-to-end
        # proof that the promise in the release body is true.
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          IDENTITY_TAG="build-${{ needs.identity.outputs.identity }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          IDENTITY_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IDENTITY_TAG}"
          if [ "${{ needs.docker.outputs.pushed }}" != "true" ]; then
            echo "::warning::No Docker image was published for this release (the push did not reach the registry); skipping the pull check."
            echo "This is an expected credential issue, not an image defect. The release body states the image was not published."
            exit 0
          fi
          echo "Pulling $IMAGE"
          docker pull --quiet "$IMAGE" || { echo "::error::Docker image not found: $IMAGE"; exit 1; }
          echo "OK Docker image present: $IMAGE"
          echo "Pulling $IDENTITY_IMAGE"
          docker pull --quiet "$IDENTITY_IMAGE" || { echo "::error::Build-identity image not found: $IDENTITY_IMAGE"; exit 1; }
          echo "OK Build-identity image present: $IDENTITY_IMAGE"
