name: Install Linux build dependencies
description: |
  Install the system libraries PhenoFabric Linux builds need.

  Every Linux build in this repository is NATIVE: the runner hosts the
  target architecture, so the packages are installed with no
  architecture suffix.

  Covers:
  - CLI x86_64: fabric-tray (libappindicator via gtk), glib, xdo,
    xcb/xkbcommon/wayland.
  - CLI aarch64: same set. On an arm64 host the packages are already
    the right architecture, and apt REJECTS an explicit `:arm64` suffix
    for the host's OWN architecture.
  - GUI: WebKit2GTK, librsvg, patchelf, plus the CLI set.

  The `arch` input was removed. It selected between a native install
  and an x86_64 -> arm64 cross-compile, and the cross-compile path is
  now dead: Linux aarch64 is built on a native `ubuntu-24.04-arm`
  runner. Keeping a dead input that silently does nothing is worse
  than removing it.

  History: the cross-compile path existed because the x86_64
  `ubuntu-latest` runner cannot fetch the arm64 package indexes. The
  old root-cause comment got it wrong: `archive.ubuntu.com` does not
  publish `binary-arm64` AT ALL (it 404s for that path permanently);
  arm64 packages live on `ports.ubuntu.com/ubuntu-ports`. That mirror
  only helps a native arm64 host, which is why the cross-compile leg
  could never work and was removed rather than repaired.

  Also worth recording: the GUI apt list once had both
  `libappindicator3-dev` and the ayatana fork, which conflict on
  Ubuntu 22.04+ (the GitHub runner). The ayatana fork is the
  maintained successor and is used here alone.

runs:
  using: composite
  steps:
    - name: apt-get update
      shell: bash
      run: |
        # On a native arm64 runner (ubuntu-24.04-arm) apt already points
        # at ports.ubuntu.com/ubuntu-ports, which is the mirror that
        # actually publishes the arm64 indexes. `archive.ubuntu.com`
        # does NOT publish `binary-arm64` AT ALL -- it returns 404 for
        # that path permanently -- so a native arm64 host must not be
        # rewritten to use it.
        #
        # The previous implementation tolerated a failing `apt-get
        # update` and rewrote the sources to the archive mirror. That
        # was a fail-open: an apt failure that was NOT a mirror problem
        # would have been swallowed, and the subsequent install would
        # have failed with a much less diagnosable error. The install
        # list below is fully satisfiable from the native mirror on
        # both architectures, so a failure here is a real failure and
        # must stop the job.
        if [ "$(dpkg --print-architecture)" = "arm64" ]; then
          echo "Native arm64 host: apt sources already point at the arm64 mirror."
        fi
        sudo apt-get update

    - name: Install system libraries
      shell: bash
      run: |
        # Installed WITHOUT an architecture suffix. On an arm64 host the
        # packages are already the right architecture, and apt REJECTS an
        # explicit `:arm64` suffix for the host's own architecture.
        sudo apt-get install -y --no-install-recommends \
          libxcb-render0-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxkbcommon-dev \
          libwayland-dev \
          libgtk-3-dev \
          libxdo-dev \
          libayatana-appindicator3-dev \
          libwebkit2gtk-4.1-dev \
          librsvg2-dev \
          patchelf
