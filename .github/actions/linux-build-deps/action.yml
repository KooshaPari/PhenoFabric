name: Install Linux build dependencies
description: |
  Install the system libraries PhenoFabric Linux builds need.

  Covers:
  - CLI x86_64: fabric-tray (libappindicator via gtk), glib, xdo,
    xcb/xkbcommon/wayland.
  - CLI aarch64 (cross): same set, :arm64-arch.
  - GUI: WebKit2GTK, librsvg, patchelf, plus the CLI set.

  Both [Install Linux GUI dependencies] and [Install cross-compilation
  tools] were missing the glib/appindicator/xdo set on Linux x86_64 and
  aarch64. The GUI apt list had both libappindicator3-dev and the
  ayatana fork, which conflict on Ubuntu 22.04+ (GitHub runner); the
  ayatana fork is the maintained successor and is kept here alone.

inputs:
  arch:
    description: |
      'host' for native x86_64 builds, 'arm64' for aarch64 cross-compile.
      Defaults to 'host'.
    required: false
    default: 'host'

runs:
  using: composite
  steps:
    - name: Add arm64 architecture (cross-compile only)
      if: inputs.arch == 'arm64'
      shell: bash
      run: sudo dpkg --add-architecture arm64

    - name: apt-get update
      shell: bash
      run: |
        # GitHub-hosted arm64 cross-compile runners can 404 on the
        # security/archive mirror arm64 indexes; the build doesn't need
        # security-patched runtime libs, so we tolerate the 404 and
        # continue with whatever indexes the archive mirror did return.
        set +e
        sudo apt-get update
        rc=$?
        if [ $rc -ne 0 ]; then
          echo "apt-get update exited $rc; arm64 security/archive mirrors may have 404'd."
          echo "Rewriting sources to only the archive mirror (no security pocket)."
          # Remove the deb822 sources file entirely so apt can't try to
          # parse it as deb822, then write a fresh legacy one-line
          # sources.list with only the archive mirror (archive.ubuntu.com
          # has full arm64 coverage; security.ubuntu.com does not).
          sudo rm -f /etc/apt/sources.list.d/ubuntu.sources
          sudo rm -f /etc/apt/sources.list.d/*ubuntu*.sources
          # Disable any deb822 sources for ubuntu from the legacy
          # sources.list (should be a no-op on Ubuntu 24.04 which uses
          # .d/, but belt and suspenders).
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '/noble-security\|noble-updates\|noble-backports/d' /etc/apt/sources.list || true
          fi
          # Write a clean legacy-style sources.list. Apt 2.x supports
          # both legacy and deb822 formats; the legacy one-line format
          # is the simplest to get right without deb822 edge cases.
          sudo tee /etc/apt/sources.list.d/ubuntu.list > /dev/null <<'EOF'
deb [arch=amd64,arm64] http://azure.archive.ubuntu.com/ubuntu noble main universe restricted multiverse
EOF
          sudo apt-get update
        fi

    - name: Install system libraries (host, x86_64)
      if: inputs.arch == 'host'
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends \
          libxcb-render0-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxkbcommon-dev \
          libwayland-dev \
          libgtk-3-dev \
          libxdo-dev \
          libayatana-appindicator3-dev \
          libwebkit2gtk-4.1-dev \
          librsvg2-dev \
          patchelf

    - name: Install system libraries (aarch64 cross)
      if: inputs.arch == 'arm64'
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends \
          gcc-aarch64-linux-gnu \
          libxcb-render0-dev:arm64 \
          libxcb-shape0-dev:arm64 \
          libxcb-xfixes0-dev:arm64 \
          libxkbcommon-dev:arm64 \
          libwayland-dev:arm64 \
          libgtk-3-dev:arm64 \
          libxdo-dev:arm64 \
          libayatana-appindicator3-dev:arm64
