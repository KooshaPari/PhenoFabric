version: 2
updates:
  # ── Cargo (Rust) dependencies ──────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    groups:
      rust-dependencies:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
    # See issue #32: dependabot security-update runs fail with
    # "No Cargo.toml!" on this monorepo (bug dependabot/dependabot-core#13345,
    # fixed upstream in PR #13359 Nov 2025; runtime on github.com still hits it).
    # These two specific advisories point at the nested `src-tauri` subcrate,
    # which the parser's `check_required_files` can't resolve. Skipping them
    # in dependabot.yml silences the failed run; the alerts remain visible in
    # the Security tab and the operator still owns the actual version bumps.
    # - glib 0.18.5 → 0.20.0: GTK stack major bump; needs src-tauri smoke test.
    # - opentelemetry_sdk 0.27.1 → 0.32.1: 5-minor bump; needs code changes in
    #   fabric-daemon (publish=None, so this is not blocking the next release).
    ignore:
      - dependency-name: "glib"
      - dependency-name: "opentelemetry_sdk"

  # ── GitHub Actions ────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns: ["*"]

  # ── Go modules (per command) ──────────────────────────────────────
  - package-ecosystem: "gomod"
    directory: "/cmd/capprobe"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"

  - package-ecosystem: "gomod"
    directory: "/cmd/checker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"

  - package-ecosystem: "gomod"
    directory: "/cmd/trust"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"

  - package-ecosystem: "gomod"
    directory: "/cmd/wire"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"

  # ── Docker ───────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
