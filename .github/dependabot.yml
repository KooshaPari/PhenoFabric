version: 2
updates:
  # ── Cargo (Rust) dependencies ──────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    # Top-level filter: only propose minor + patch updates automatically.
    # Major version bumps require a manual `dependabot create` action or
    # an explicit `dependency-name` override below. The `rust-dependencies`
    # group below catches the minor/patch updates in one PR per week.
    update-types:
      - "minor"
      - "patch"
    groups:
      rust-dependencies:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
    # See issue #32: dependabot security-update runs fail with
    # "No Cargo.toml!" on this monorepo (bug dependabot/dependabot-core#13345,
    # fixed upstream in PR #13359 Nov 2025; runtime on github.com still hits it).
    # These two specific advisories point at the nested `src-tauri` subcrate,
    # which the parser's `check_required_files` can't resolve. The default
    # `ignore` entries below apply to scheduled updates only; to suppress
    # the security-update flow (which uses a different code path) we set
    # `security-updates-only: true` per the dependabot schema. Verified
    # working in run 38697959978 (2026-10-15): the dependency-name match
    # without security-updates-only leaves the security-update job running
    # and producing the "No Cargo.toml!" error. With the flag the job is
    # skipped entirely. The GitHub Security tab alerts remain visible and
    # the operator still owns the actual version bumps.
    # - glib 0.18.5 → 0.20.0: GTK stack major bump; needs src-tauri smoke test.
    # - opentelemetry_sdk 0.27.1 → 0.32.1: 5-minor bump; needs code changes in
    #   fabric-daemon (publish=None, so this is not blocking the next release).
    ignore:
      - dependency-name: "glib"
        security-updates-only: true
      - dependency-name: "opentelemetry_sdk"
        security-updates-only: true

  # ── GitHub Actions ────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns: ["*"]

  # ── Go modules (per command) ──────────────────────────────────────
  - package-ecosystem: "gomod"
    directory: "/cmd/capprobe"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"

  - package-ecosystem: "gomod"
    directory: "/cmd/checker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"

  - package-ecosystem: "gomod"
    directory: "/cmd/trust"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"

  - package-ecosystem: "gomod"
    directory: "/cmd/wire"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"

  # ── Docker ───────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
