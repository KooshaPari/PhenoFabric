version: 2
updates:
  # ── Cargo (Rust) dependencies ──────────────────────────────────────
  - package-ecosystem: "cargo"
    # Issue #32: "No Cargo.toml!" on security-update runs.
    #
    # Root cause (verified 2026-10-15): `crates/fabric-gui/src-tauri`
    # is EXCLUDED from the root workspace (see the root Cargo.toml
    # `exclude` array) and declares its own empty `[workspace]` plus
    # its own `Cargo.lock`. Dependabot's security-update path still
    # synthesised jobs rooted at `/crates/fabric-daemon` and
    # `/crates/fabric-gui/src-tauri` and its cargo FileParser's
    # `check_required_files` could not resolve a manifest at those
    # nested roots, dying with "No Cargo.toml!"
    # (dependabot/dependabot-core#13345).
    #
    # Observed 2026-10-15T21:38Z: 7 of 7 ad-hoc `src-tauri` jobs
    # failed while the sibling job rooted at `/` succeeded. The
    # `ignore: [{security-updates-only: true}]` entries added in R31
    # did NOT suppress them — that approach is disproven and has
    # been removed.
    #
    # Fix: declare every cargo manifest location explicitly with the
    # plural `directories` key, so Dependabot parses each manifest
    # directly instead of discovering nested workspaces implicitly.
    directories:
      - "/"
      - "/crates/fabric-gui/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    # Top-level filter: only propose minor + patch updates automatically.
    # Major version bumps require a manual `dependabot create` action or
    # an explicit `dependency-name` override below. The `rust-dependencies`
    # group below catches the minor/patch updates in one PR per week.
    update-types:
      - "minor"
      - "patch"
    groups:
      rust-dependencies:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
    # NOTE: the `ignore` entries for glib / opentelemetry_sdk that
    # lived here were removed in R39. They were added in R31 on the
    # theory that `security-updates-only: true` would suppress the
    # failing ad-hoc jobs. It does not: the 2026-10-15 evidence shows
    # those jobs still queued and still failed. The ignores only
    # hid the alerts from Dependabot's own PR generation, which is
    # not what we want now that the manifests resolve.

  # ── GitHub Actions ────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns: ["*"]

  # ── Go modules (per command) ──────────────────────────────────────
  - package-ecosystem: "gomod"
    directory: "/cmd/capprobe"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"

  - package-ecosystem: "gomod"
    directory: "/cmd/checker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"

  - package-ecosystem: "gomod"
    directory: "/cmd/trust"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"

  - package-ecosystem: "gomod"
    directory: "/cmd/wire"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"

  # ── Docker ───────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
