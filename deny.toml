# cargo-deny configuration for Phenotype Fabric
# https://embarkstudios.github.io/cargo-deny/

# ── advisories ──────────────────────────────────────────────────────────
[advisories]
version = 2
# Warn on yanked crates (deny blocks the build; warn is informational).
yanked = "warn"
# Ignore specific advisories (add RUSTSEC-XXXX-XXXX here if needed).
ignore = [
    # RUSTSEC-2024-0436 — paste 1.0.15 (unmaintained) via various macros.
    # Replace with pastey (separate change).
    "RUSTSEC-2024-0436",
    # RUSTSEC-2024-0370 — proc-macro-error (unmaintained, syn 1.x).
    # Dev-dep only; no runtime exposure.
    "RUSTSEC-2024-0370",
    # RUSTSEC-2026-0173 — proc-macro-error2 (unmaintained). Author has
    # archived; recommend manyhow (separate change).
    "RUSTSEC-2026-0173",
    # RUSTSEC-2023-0071 — rsa 0.9.10 (Marvin timing attack) via
    # jsonwebtoken. No patch available (RustCrypto/RSA#626).
    # Local use only, no network timing attack surface in the
    # current fabric-daemon.
    # NOTE: jsonwebtoken is now 11.1.0; the advisory no longer
    # matches any crate in Cargo.lock. Kept for review in the next
    # lockfile refresh — `cargo deny check advisories` reports it
    # as `advisory-not-detected`.
    "RUSTSEC-2023-0071",
    # RUSTSEC-2024-0449 — unsafe-libyaml 0.2.11 (unmaintained) via
    # serde_yaml 0.9.34+deprecated → fabric-cli. Replacement is
    # saphyr / serde_yaml_ng (separate change). Dev-time config
    # parsing only, no runtime exposure.
    "RUSTSEC-2024-0449",
]

# ── licenses ────────────────────────────────────────────────────────────
[licenses]
version = 2
# Allow these license identifiers (SPDX). All other licenses are denied
# by default in version 2 — no need to enumerate copyleft licenses.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "MPL-2.0",
]
# Don't confidence-check the license field.
confidence-threshold = 0.8

# ── bans ────────────────────────────────────────────────────────────────
[bans]
# Warn on multiple versions of the same crate.
multiple-versions = "warn"
# Wildcard allow for dev-dependencies.
wildcards = "allow"
# Allow specific crates to have duplicates.
skip = []

# Deny specific crates.
deny = [
    # { name = "openssl", wrappers = ["openssl-sys"] },
]

# ── sources ─────────────────────────────────────────────────────────────
[sources]
# Only allow crates from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
