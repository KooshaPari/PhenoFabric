<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#00cc99"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#00ffff" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>

  <!-- Terminal window frame -->
  <rect x="60" y="80" width="392" height="352" rx="12" fill="#0f0f23" stroke="#00ffff" stroke-width="3" filter="url(#shadow)"/>

  <!-- Title bar -->
  <rect x="60" y="80" width="392" height="40" rx="12" fill="#1a1a3e"/>
  <circle cx="90" cy="100" r="7" fill="#ff5f57"/>
  <circle cx="114" cy="100" r="7" fill="#febc2e"/>
  <circle cx="138" cy="100" r="7" fill="#28c840"/>
  <text x="256" y="105" font-family="monospace" font-size="16" fill="#00ffff" text-anchor="middle" opacity="0.7">terminal-fabric</text>

  <!-- Connection mesh nodes -->
  <!-- Node 1 - top left -->
  <circle cx="140" cy="200" r="16" fill="#00ffff" opacity="0.9"/>
  <rect x="124" y="216" width="32" height="8" rx="2" fill="#00ffff" opacity="0.5"/>
  <text x="140" y="205" font-family="monospace" font-size="14" fill="#1a1a2e" text-anchor="middle" font-weight="bold">A</text>

  <!-- Node 2 - top right -->
  <circle cx="372" cy="200" r="16" fill="#00ffff" opacity="0.9"/>
  <rect x="356" y="216" width="32" height="8" rx="2" fill="#00ffff" opacity="0.5"/>
  <text x="372" y="205" font-family="monospace" font-size="14" fill="#1a1a2e" text-anchor="middle" font-weight="bold">B</text>

  <!-- Node 3 - bottom left -->
  <circle cx="140" cy="350" r="16" fill="#00ffff" opacity="0.9"/>
  <rect x="124" y="366" width="32" height="8" rx="2" fill="#00ffff" opacity="0.5"/>
  <text x="140" y="355" font-family="monospace" font-size="14" fill="#1a1a2e" text-anchor="middle" font-weight="bold">C</text>

  <!-- Node 4 - bottom right -->
  <circle cx="372" cy="350" r="16" fill="#00ffff" opacity="0.9"/>
  <rect x="356" y="366" width="32" height="8" rx="2" fill="#00ffff" opacity="0.5"/>
  <text x="372" y="355" font-family="monospace" font-size="14" fill="#1a1a2e" text-anchor="middle" font-weight="bold">D</text>

  <!-- Center hub -->
  <circle cx="256" cy="275" r="24" fill="#00ffff" opacity="0.15" stroke="#00ffff" stroke-width="2"/>
  <circle cx="256" cy="275" r="12" fill="#00ffff" opacity="0.9"/>
  <text x="256" y="280" font-family="monospace" font-size="12" fill="#1a1a2e" text-anchor="middle" font-weight="bold">TF</text>

  <!-- Connection lines (fabric mesh) -->
  <line x1="156" y1="200" x2="244" y2="275" stroke="#00ffff" stroke-width="2" opacity="0.6"/>
  <line x1="356" y1="200" x2="268" y2="275" stroke="#00ffff" stroke-width="2" opacity="0.6"/>
  <line x1="156" y1="350" x2="244" y2="275" stroke="#00ffff" stroke-width="2" opacity="0.6"/>
  <line x1="356" y1="350" x2="268" y2="275" stroke="#00ffff" stroke-width="2" opacity="0.6"/>
  <line x1="156" y1="216" x2="156" y2="334" stroke="#00ffff" stroke-width="1.5" opacity="0.3"/>
  <line x1="356" y1="216" x2="356" y2="334" stroke="#00ffff" stroke-width="1.5" opacity="0.3"/>
  <line x1="156" y1="200" x2="356" y2="200" stroke="#00ffff" stroke-width="1.5" opacity="0.3"/>
  <line x1="156" y1="350" x2="356" y2="350" stroke="#00ffff" stroke-width="1.5" opacity="0.3"/>

  <!-- Pulse rings on center -->
  <circle cx="256" cy="275" r="40" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.2"/>
  <circle cx="256" cy="275" r="56" fill="none" stroke="#00ffff" stroke-width="0.8" opacity="0.1"/>

  <!-- Text label -->
  <text x="256" y="460" font-family="monospace" font-size="28" fill="#00ffff" text-anchor="middle" font-weight="bold" letter-spacing="4">TERMINAL FABRIC</text>
</svg>
