[package]
name = "fabric-full-demo"
version = "0.1.0"
edition = "2021"
publish = false
description = "Complete working demo: boots daemon, loads topology, compiles routes, streams a test frame"
license = "MIT OR Apache-2.0"

[[bin]]
name = "fabric-full-demo"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fabric-graph = { path = "../../crates/fabric-graph" }
fabric-capability = { path = "../../crates/fabric-capability" }
fabric-checker = { path = "../../crates/fabric-checker" }
fabric-frame-transport = { path = "../../crates/fabric-frame-transport" }
fabric-daemon = { path = "../../crates/fabric-daemon" }

serde = { workspace = true }
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
anyhow = "1.0"
bytes = "1.7"
tempfile = "3"
