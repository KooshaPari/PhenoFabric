[package]
name = "phenotype-nvms-adapter"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Bridge between odin.nvms v0.2 application manifests and Phenotype Fabric CapabilityDescriptors."

[dependencies]
fabric-capability = { path = "../fabric-capability" }
phenotype-manifest = { path = "../../../nanovms/crates/phenotype-manifest" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
uuid = { version = "1.10", features = ["v7", "serde"] }

[dev-dependencies]
fabric-capability = { path = "../fabric-capability" }

[lints]
workspace = true
