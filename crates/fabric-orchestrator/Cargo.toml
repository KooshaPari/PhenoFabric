[package]
name = "fabric-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "End-to-end daemon orchestrator for Phenotype Fabric. Wires coordinator, persist, wire server, and surface registry into a single running process."

[[bin]]
name = "fabric-orchestrator"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
surface-mojo = ["fabric-surface-mojo"]

[dependencies]
fabric-daemon = { path = "../fabric-daemon" }
fabric-graph = { workspace = true }
fabric-capability = { workspace = true }
fabric-persist = { path = "../fabric-persist" }
fabric-frame-transport = { path = "../fabric-frame-transport" }
fabric-checker = { path = "../fabric-checker" }
fabric-workspace = { path = "../fabric-workspace" }
fabric-surface-mojo = { path = "../fabric-surface-mojo", optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
ctrlc = "3"

[dev-dependencies]
tempfile = "3"
