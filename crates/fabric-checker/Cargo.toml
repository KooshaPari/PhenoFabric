[package]
name = "fabric-checker"
version = "0.1.0"
edition = "2021"
description = "PF-WP-011: cross-checks a Fabric capability probe against an application manifest and emits a structured admission decision."
license = "Apache-2.0"

[dependencies]
fabric-capability = { path = "../fabric-capability" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "checker"
harness = false
