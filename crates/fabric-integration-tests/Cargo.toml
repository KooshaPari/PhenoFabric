[package]
name = "fabric-integration-tests"
version = "0.1.0"
edition = "2021"
description = "Cross-crate integration tests for Phenotype Fabric"
publish = false

# Shared helpers in src/lib.rs need these as regular dependencies.
[dependencies]
fabric-graph = { path = "../fabric-graph" }
fabric-capability = { path = "../fabric-capability" }
fabric-checker = { path = "../fabric-checker" }
fabric-frame-transport = { path = "../fabric-frame-transport" }
fabric-daemon = { path = "../fabric-daemon" }
anyhow = "1"
bytes = "1"
chrono = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4", "v7"] }
tempfile = "3"

[dev-dependencies]
fabric-persist = { path = "../fabric-persist" }
fabric-workspace = { path = "../fabric-workspace" }
phenotype-nvms-adapter = { path = "../phenotype-nvms-adapter" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }
toml = "0.8"
