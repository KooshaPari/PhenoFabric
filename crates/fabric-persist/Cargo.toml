[package]
name = "fabric-persist"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "SQLite persistence layer for Phenotype Fabric coordinator state"

[dependencies]
fabric-graph = { path = "../fabric-graph" }
fabric-capability = { path = "../fabric-capability" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
