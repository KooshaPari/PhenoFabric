[package]
name = "phenotype-manifest"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "`odin.nvms` v0.2 schema + validator + JSON Schema emission (vendored from nanovms; see docs/architecture/PHENOTYPE-MANIFEST-VENDORING.md)."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.2", features = ["preserve_order"] }
thiserror = "2.0"
