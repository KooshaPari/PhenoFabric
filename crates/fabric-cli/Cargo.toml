[package]
name = "fabric-cli"
version = "0.1.0"
edition = "2021"
description = "Phenotype Fabric reference CLI — cap, graph, route, workspace subcommands"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "fabric"
path = "src/main.rs"

[lib]
name = "fabric_cli"
path = "src/lib.rs"

[dependencies]
fabric-capability = { path = "../fabric-capability" }
fabric-graph = { path = "../fabric-graph" }
phenotype-nvms-adapter = { path = "../phenotype-nvms-adapter" }

anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
ed25519-dalek = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
zeroize = "1.7"
dirs = "5.0"
bstr = "1.9"
thiserror = "1.0"
console = "0.15"
ratatui = "0.29"
crossterm = "0.28"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
