[package]
name = "fabric-gui"
version = "0.1.0"
edition = "2021"
description = "Phenotype Fabric -- Tauri v2 desktop shell with daemon integration"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
fabric-graph = { path = "../fabric-graph" }
fabric-tray = { path = "../fabric-tray" }
fabric-persist = { path = "../fabric-persist" }
fabric-capability = { path = "../fabric-capability" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
dirs = "5.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { workspace = true }
uuid = { workspace = true }
