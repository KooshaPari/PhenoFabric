<!DOCTYPE html>
<html lang="en" dir="ltr" theme="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phenotype Fabric</title>
    <link data-trunk rel="rust" data-wasm-opt="2" />
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --green: #3fb950;
            --red: #f85149;
            --yellow: #d29922;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 200px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .sidebar h1 { font-size: 1.2rem; margin-bottom: 0.5rem; }
        .sidebar a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
        }
        .sidebar a:hover, .sidebar a[aria-current="page"] {
            background: var(--border);
            color: var(--accent);
        }
        .content {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
        }
        h2 { margin-bottom: 1rem; }
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        .data-table th, .data-table td {
            padding: 0.5rem 0.8rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .data-table th {
            color: var(--accent);
            font-weight: 600;
        }
        .data-table tr:hover td {
            background: var(--surface);
        }
        .mono { font-family: monospace; font-size: 0.9em; }
        .info-grid td { padding: 0.4rem 0.8rem; }
        .info-grid td:first-child { color: var(--text-muted); }
        .status-ok { color: var(--green); }
        .status-error { color: var(--red); }
        .loading { color: var(--text-muted); }
        .error { color: var(--red); }
        .empty { color: var(--text-muted); margin-top: 2rem; }
    </style>
</head>
<body>
</body>
</html>
