[package]
name = "fabric-capability"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Fabric capability discovery, descriptor signing, and topology probing"
repository = "https://github.com/phenotype-dev/phenotype-fabric"
rust-version = "1.81"
keywords = ["fabric", "capability", "topology", "hardware-probe"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
thiserror = "2.0"
schemars = { version = "0.8", features = ["derive", "chrono"] }
jsonschema = "0.27"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
similar = "2.6"

[[test]]
name = "descriptor_roundtrip"
path = "tests/descriptor_roundtrip.rs"

[[test]]
name = "signature"
path = "tests/signature.rs"

[[test]]
name = "fixtures_roundtrip"
path = "tests/fixtures_roundtrip.rs"

[[test]]
name = "trust_root_chain"
path = "tests/trust_root_chain.rs"

[[example]]
name = "verify_fixtures"
path = "examples/verify_fixtures.rs"
