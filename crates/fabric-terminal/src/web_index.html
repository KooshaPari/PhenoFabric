<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Fabric - Web Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 8px 16px;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        header h1 {
            font-size: 14px;
            font-weight: 600;
            color: #53d8fb;
        }
        #status {
            font-size: 12px;
            color: #aaa;
        }
        #pane-select {
            background: #0f3460;
            color: #e0e0e0;
            border: 1px solid #53d8fb44;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
        }
        #terminal-container {
            flex: 1;
            padding: 4px;
            overflow: hidden;
        }
        #terminal {
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Terminal Fabric</h1>
        <select id="pane-select">
            <option value="">Select a pane...</option>
        </select>
        <span id="status">Disconnected</span>
    </header>
    <div id="terminal-container">
        <div id="terminal"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
    <script>
        const term = new Terminal({
            cursorBlink: true,
            fontSize: 14,
            fontFamily: "'SF Mono', 'Fira Code', 'Cascadia Code', monospace",
            theme: {
                background: '#1a1a2e',
                foreground: '#e0e0e0',
                cursor: '#53d8fb',
                selectionBackground: '#53d8fb44',
            }
        });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal'));
        fitAddon.fit();

        const statusEl = document.getElementById('status');
        const paneSelect = document.getElementById('pane-select');
        let ws = null;

        function connect(paneId) {
            if (ws) {
                ws.close();
            }
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const url = `${proto}//${location.host}/ws/terminal/${paneId}`;
            statusEl.textContent = 'Connecting...';

            ws = new WebSocket(url);
            ws.onopen = () => {
                statusEl.textContent = 'Connected to ' + paneId;
                statusEl.style.color = '#4caf50';
            };
            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'screen') {
                        term.clear();
                        if (msg.lines && msg.lines.length > 0) {
                            term.write(msg.lines.join('\n'));
                        }
                    }
                } catch (e) {
                    term.write(event.data);
                }
            };
            ws.onclose = () => {
                statusEl.textContent = 'Disconnected';
                statusEl.style.color = '#aaa';
            };
            ws.onerror = () => {
                statusEl.textContent = 'Error';
                statusEl.style.color = '#f44336';
            };
        }

        paneSelect.addEventListener('change', () => {
            const paneId = paneSelect.value;
            if (paneId) connect(paneId);
        });

        // Fetch available panes
        fetch('/api/panes')
            .then(r => r.json())
            .then(data => {
                if (data.success && data.data) {
                    data.data.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.pane_id;
                        opt.textContent = `${p.pane_id} (${p.workspace_id}/${p.tab_id})`;
                        paneSelect.appendChild(opt);
                    });
                }
            })
            .catch(() => {});

        window.addEventListener('resize', () => fitAddon.fit());
    </script>
</body>
</html>
