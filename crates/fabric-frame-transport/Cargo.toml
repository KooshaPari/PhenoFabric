[package]
name = "fabric-frame-transport"
version = "0.1.0"
edition = "2021"
description = "Phenotype Fabric frame transport — HEVC/AV1 encoded frames over TCP for Parsec-style streaming"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.7"
anyhow = "1.0"
tracing = "0.1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time"] }
