[package]
name = "fabric-tray"
version = "0.1.0"
edition = "2021"
description = "Phenotype Fabric system tray app — daemon lifecycle, quick actions, status"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "fabric-tray"
path = "src/main.rs"

[dependencies]
tray-icon = "0.19"
tao = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
