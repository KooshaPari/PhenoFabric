[package]
name = "fabric-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Long-running coordinator daemon for Phenotype Fabric. Manages topology, leases, wire transport, and health checks."

[[bin]]
name = "fabric-daemon"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fabric-graph.workspace = true
fabric-capability.workspace = true
fabric-persist = { path = "../fabric-persist" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
toml = "0.8"
ctrlc = "3"

[dev-dependencies]
tempfile = "3"
