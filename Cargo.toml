[workspace]
resolver = "2"
exclude = [
    "crates/fabric-frame-transport/fuzz",
    "crates/fabric-gui/src-tauri",
]
members = [
    "crates/fabric-capability",
    "crates/fabric-capability-ffi",
    "crates/fabric-checker",
    "crates/fabric-graph",
    "crates/fabric-graph-cli",
    "crates/fabric-persist",
    "crates/fabric-daemon",
    "crates/fabric-cli",
    "crates/fabric-tray",
    "crates/fabric-gui",
    "crates/fabric-web",
    "crates/fabric-frame-transport",
    "crates/phenotype-nvms-adapter",
    "crates/phenotype-manifest",
    "crates/fabric-integration-tests",
    "crates/fabric-tui",
    "crates/fabric-workspace",
    "crates/fabric-surface-mojo",
    "crates/fabric-orchestrator",
    "crates/fabric-terminal",
    "crates/fabric-capture",
    "examples/full-demo", "crates/fabric-research-ledger",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.81"
repository = "https://github.com/phenotype-dev/phenotype-fabric"
authors = ["Phenotype Fabric Team"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = "0.9"
thiserror = "2.0"
schemars = { version = "0.8", features = ["derive", "chrono"] }
jsonschema = "0.27"
fabric-capability = { path = "crates/fabric-capability" }
fabric-graph = { path = "crates/fabric-graph" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[patch.crates-io]
# RESOLVED: RUSTSEC-2026-0195 / RUSTSEC-2026-0196 — quick-xml < 0.41.0
# Fixed 2026-09-13 by upgrading eframe from 0.31.x to 0.36.2, which pulls in:
#   fabric-gui -> eframe 0.36.2 -> accesskit_winit -> accesskit_unix
#   -> accesskit_atspi_common -> atspi-common -> zbus-lockstep 0.5.x
#   -> zbus_xml 5.2.x -> winnow (replaced quick-xml entirely)
#
# quick-xml 0.41.0 remains as a transitive dependency of schemars (via serde_json)
# but is no longer vulnerable (the DoS was in NsReader/attribute checking paths
# used only by zbus_xml for D-Bus introspection XML parsing).

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# fabric-capture is a small self-updating capture agent, so it prefers size over
# speed. This was previously declared as a [profile.release] block inside
# crates/fabric-capture/Cargo.toml, where Cargo silently ignores it (member
# profiles do not apply; only the workspace root counts), so the setting never
# took effect. Package overrides at the root are the supported spelling.
# `lto` is intentionally omitted: Cargo rejects it inside a package override, and
# the root profile's `lto = "thin"` still applies.
[profile.release.package.fabric-capture]
opt-level = "s"
strip = "symbols"
