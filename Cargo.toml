[workspace]
resolver = "2"
members = [
    "crates/fabric-capability",
    "crates/fabric-capability-ffi",
    "crates/fabric-graph",
    "crates/phenotype-nvms-adapter",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.81"
repository = "https://github.com/phenotype-dev/phenotype-fabric"
authors = ["Phenotype Fabric Team"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = "0.6"
thiserror = "2.0"
schemars = { version = "0.8", features = ["derive", "chrono"] }
jsonschema = "0.27"
fabric-capability = { path = "crates/fabric-capability" }
fabric-graph = { path = "crates/fabric-graph" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
