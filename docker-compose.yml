# ──────────────────────────────────────────────────────────────────────
# Docker Compose for Phenotype Fabric daemon
# ──────────────────────────────────────────────────────────────────────
# Usage:
#   docker compose up -d          # Start daemon + monitoring
#   docker compose logs -f        # Follow logs
#   docker compose down           # Stop all services
#
# State is persisted to ./data on the host (SQLite database).
# Grafana: http://localhost:3000  (admin/admin)
# Prometheus: http://localhost:9090
# ──────────────────────────────────────────────────────────────────────

services:
  fabric-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fabric-daemon
    restart: unless-stopped
    ports:
      - "9400:9400"       # Wire server (TCP JSON protocol)
      - "9401:9401"       # Prometheus metrics endpoint
    volumes:
      - ./data:/var/lib/fabric
    environment:
      - RUST_LOG=info
      # Override config via environment variables or mount a config file:
      # - FABRIC_LISTEN=0.0.0.0:9400
      # - FABRIC_LOG_LEVEL=info
    # To mount a custom config file, uncomment:
    #   volumes:
    #     - ./config.toml:/etc/fabric/config.toml:ro
    #   command: ["start", "--config", "/etc/fabric/config.toml"]
    healthcheck:
      test: ["/usr/local/bin/fabric-cli", "health", "--connect", "127.0.0.1:9400"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:latest
    container_name: fabric-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    depends_on:
      fabric-daemon:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    container_name: fabric-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./deploy/monitoring/grafana/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./deploy/monitoring/grafana/provisioning.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      prometheus:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  prometheus-data:
  grafana-data:
