global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'fabric-daemon'
    static_configs:
      - targets: ['localhost:9401']
    metrics_path: /metrics
    scrape_interval: 5s

  # Federation: scrape peer daemons for multi-node topology
  - job_name: 'fabric-daemon-federation'
    static_configs:
      - targets: []  # Populated via /etc/prometheus/federation-targets.yml
        labels:
          federation: 'true'
    metrics_path: /metrics
    scrape_interval: 10s
    honor_labels: true
