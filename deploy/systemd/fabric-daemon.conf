# ──────────────────────────────────────────────────────────────────────
# Phenotype Fabric daemon configuration
# ──────────────────────────────────────────────────────────────────────
# Copy to /etc/fabric/config.toml and adjust as needed.
# Config priority: CLI args > config file > env vars > defaults.
# ──────────────────────────────────────────────────────────────────────

# Wire transport server (TCP JSON protocol).
[server]
listen       = "0.0.0.0:9400"        # Bind address (0.0.0.0 for external access).
max_connections = 64                  # Max concurrent wire connections.
request_timeout_ms = 5000             # Per-request timeout (ms).

# SQLite persistence.
[database]
path         = "/var/lib/fabric/state.db"
wal_mode     = true                   # Write-Ahead Logging for concurrency.
flush_interval_ms = 1000              # Background flush interval (0 = sync).

# Topology probing.
[topology]
auto_probe   = true                   # Probe peers on startup.
probe_interval_s = 30                 # Re-probe interval (seconds).
epoch_persistence = true              # Persist epoch across restarts.

# Lease management.
[leases]
default_ttl_s   = 3600                # 1 hour default lease.
max_ttl_s       = 86400               # 24 hour hard cap.
renewal_window_s = 300                # Renew 5 min before expiry.
fairness_policy = "FairShare"         # FairShare | FirstCome | Priority.

# Coordinator settings (for multi-node deployments).
# When running a single-node daemon, these are unused.
[coordinator]
# node_id    = "fabric-node-1"        # Unique identifier for this node.
# peers      = []                     # Seed peer addresses (wire protocol).
# join_timeout_s = 10                 # Timeout when joining a cluster.

# Logging.
[logging]
level  = "info"                       # trace | debug | info | warn | error.
format = "pretty"                     # pretty | json | compact.
# file  = "/var/log/fabric/daemon.log"  # Uncomment to log to file.
